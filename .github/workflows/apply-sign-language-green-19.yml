name: Apply sign language GREEN 19

# Retry after correcting the synthetic all-unlabelled fixture and Python 3.13 dynamic import harness.
on:
  push:
    paths:
      - ".github/workflows/apply-sign-language-green-19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sign-lang-19
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Apply narrow converter propagation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('programs/tlhdig/convert.py')
          t = p.read_text(encoding='utf8')
          def rep(old, new):
              global t
              assert old in t, old[:100]
              t = t.replace(old, new, 1)

          rep(
              '_STRIP_TAGS = re.compile(rb"<[^>]*>")\n\n\ndef _manuscripts',
              '_STRIP_TAGS = re.compile(rb"<[^>]*>")\n\n\ndef _positive_lang(raw):\n'
              '    """Return a positive source language value; empty/XXXlang are unset."""\n'
              '    if raw is None:\n'
              '        return None\n'
              '    value = raw.strip()\n'
              '    return value if value and value != "XXXlang" else None\n\n\ndef _manuscripts',
          )
          rep(
              '    state = _State(cv, keep_empty, omap, lexemes)\n',
              '    state = _State(cv, keep_empty, omap, lexemes, text_lang=lang)\n',
          )
          rep(
              '    def __init__(self, cv, keep_empty: bool, omap=None, lexemes=None):\n'
              '        self.cv = cv\n'
              '        self.keep_empty = keep_empty\n',
              '    def __init__(self, cv, keep_empty: bool, omap=None, lexemes=None, text_lang=None):\n'
              '        self.cv = cv\n'
              '        self.keep_empty = keep_empty\n'
              '        self.text_lang = _positive_lang(text_lang)\n'
              '        self.line_lang = None\n'
              '        self.colon_lang = None\n',
          )
          rep(
              '        else:\n            self._close(("line",))\n\n        if self.paragraph is None:\n',
              '        else:\n            self._close(("line",))\n\n        self.line_lang = _positive_lang(node.get("lg"))\n        if self.paragraph is None:\n',
          )
          rep(
              '        self._close(("colon",))\n        self.colon = cv.node("colon")\n',
              '        self._close(("colon",))\n        self.colon_lang = _positive_lang(node.get("lg"))\n        self.colon = cv.node("colon")\n',
          )
          rep(
              '        w = cv.node("word")\n        trans = node.get("trans")\n',
              '        word_lang = (\n'
              '            _positive_lang(node.get("lg"))\n'
              '            or self.colon_lang\n'
              '            or self.line_lang\n'
              '            or self.text_lang\n'
              '        )\n'
              '        w = cv.node("word")\n        trans = node.get("trans")\n',
          )
          rep(
              '            cv.feature(\n                s, srcxml=t.srcxml, sym=t.sym, after=t.after, type=t.type,\n'
              '                sgr=t.sgr, agr=t.agr, det=t.det, num=t.num,\n            )\n',
              '            cv.feature(\n                s, srcxml=t.srcxml, sym=t.sym, after=t.after, type=t.type,\n'
              '                sgr=t.sgr, agr=t.agr, det=t.det, num=t.num,\n            )\n'
              '            if word_lang is not None and t.type != "empty":\n'
              '                cv.feature(s, lang=word_lang)\n',
          )
          rep(
              '        if "column" in kinds:\n            self.collabel = None\n',
              '        if "line" in kinds:\n            self.line_lang = None\n'
              '        if "colon" in kinds:\n            self.colon_lang = None\n'
              '        if "column" in kinds:\n            self.collabel = None\n',
          )
          p.write_text(t, encoding='utf8')
          PY
      - name: Targeted GREEN
        run: python -m pytest programs/tests/test_sign_language.py -q
      - name: Full unit suite
        run: python -m pytest programs/tests -q
      - name: Commit implementation and remove temporary workflow
        run: |
          rm .github/workflows/apply-sign-language-green-19.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programs/tlhdig/convert.py .github/workflows/apply-sign-language-green-19.yml
          git commit -m "Propagate source language to sign slots"
          git push origin HEAD:research/sign-lang-19
