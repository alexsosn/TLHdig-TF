name: Sync Contract-A metadata #142

# One-shot generated-artifact sync. Remove before merge.
on:
  push:
    branches:
      - research/contract-a-exceptions-142
    paths:
      - ".github/workflows/sync-contract-a-142.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt

      - name: Sync shipped src_span header and generated feature docs
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "programs")
          from tlhdig import featuremeta

          path = Path("tf-provenance/0.4.0/src_span.tf")
          data = path.read_bytes()
          marker = b"@description="
          start = data.find(marker)
          if start < 0:
              raise SystemExit("src_span.tf has no @description header")
          end = data.find(b"\n", start)
          if end < 0:
              raise SystemExit("src_span.tf description line is unterminated")
          replacement = (
              "@description=" + featuremeta.DESCRIPTIONS["src_span"] + "\n"
          ).encode("utf8")
          updated = data[:start] + replacement + data[end + 1 :]
          if updated == data:
              raise SystemExit("src_span.tf description was already synchronized")
          path.write_bytes(updated)
          PY
          python programs/build_feature_docs.py

      - name: Assert metadata sync delta
        shell: bash
        run: |
          git status --short
          changed="$(git status --porcelain --untracked-files=no | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' docs/features/src_span.md tf-provenance/0.4.0/src_span.tf | sort)"
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected tracked delta after metadata sync:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit synchronized metadata
        shell: bash
        run: |
          git add docs/features/src_span.md tf-provenance/0.4.0/src_span.tf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: sync Contract-A provenance metadata (#142)"

      - name: Validate current artifact and rewrite manifest
        shell: bash
        run: |
          export TLHDIG_CODE_COMMIT="$(git rev-parse HEAD)"
          python programs/validate_current.py
          python programs/check_build_manifest.py

      - name: Keep only manifest generated delta
        shell: bash
        run: |
          git restore --worktree --staged reports 2>/dev/null || true
          git status --short
          changed="$(git status --porcelain --untracked-files=no | awk '{print $2}')"
          if [ "$changed" != "tf/0.4.0/BUILD-MANIFEST.json" ]; then
            echo "Unexpected tracked delta after current validation:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit refreshed manifest and push
        shell: bash
        run: |
          git add -f tf/0.4.0/BUILD-MANIFEST.json
          git commit -m "build: refresh current manifest for #142"
          git push origin HEAD:research/contract-a-exceptions-142
