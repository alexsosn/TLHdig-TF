name: Refresh current manifest for #144

# One-shot validation-only manifest refresh. Remove before merge.
on:
  push:
    branches:
      - fix/source-recovery-prepared-12
    paths:
      - ".github/workflows/refresh-current-manifest-144.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt

      - name: Validate unchanged current artifact and rewrite manifest
        run: python programs/validate_current.py

      - name: Verify rewritten manifest
        run: python programs/check_build_manifest.py

      - name: Assert manifest-only generated delta
        shell: bash
        run: |
          git status --short
          changed="$(git status --porcelain --untracked-files=no | awk '{print $2}')"
          if [ "$changed" != "tf/0.4.0/BUILD-MANIFEST.json" ]; then
            echo "Unexpected tracked delta after validation:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit refreshed current manifest
        shell: bash
        run: |
          git add -f tf/0.4.0/BUILD-MANIFEST.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh current manifest for #144"
          git push origin HEAD:fix/source-recovery-prepared-12
