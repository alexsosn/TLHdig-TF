name: Research docID raw semantics

on:
  push:
    branches: ['research/docid-raw']
    paths: ['.github/workflows/research-docid-raw.yml']

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/docid-raw
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Measure converter-input docID semantics
        run: python programs/analyze_docid_raw.py
      - name: Commit research only and remove helper
        run: |
          rm .github/workflows/research-docid-raw.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add programs/analyze_docid_raw.py docs/research-docid-raw.md
          git add -u .github/workflows/research-docid-raw.yml
          git diff --cached --check
          git commit -m 'Research docID raw-value semantics'
          git push origin HEAD:research/docid-raw
