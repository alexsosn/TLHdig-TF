name: Research docID raw semantics

on:
  push:
    branches: [research/docid-raw]
    paths: [.github/workflows/research-docid-raw.yml]

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/docid-raw
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Measure converter-input docID semantics
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import sys

          import lxml.etree as LE

          sys.path.insert(0, 'programs')
          from tlhdig import repair
          from tlhdig.paths import CORPUS, PATCHES, ENCRYPTED, corpus_files, rel as rel_key

          patches = repair.read_manifest(PATCHES) if PATCHES.exists() else {}
          files = corpus_files()

          counts = Counter()
          examples = {
              'trim_diff': [],
              'missing': [],
              'empty': [],
              'whitespace_only': [],
              'special_ws': [],
              'fallback': [],
              'nested': [],
          }
          raw_values = Counter()
          trim_deltas = Counter()

          def ex(kind, rel, raw=None, extra=None, limit=12):
              if len(examples[kind]) >= limit:
                  return
              item = {'path': rel}
              if raw is not None:
                  item['raw_repr'] = repr(raw)
              if extra is not None:
                  item['extra'] = extra
              examples[kind].append(item)

          for path in files:
              counts['source_xml'] += 1
              rel = rel_key(path, CORPUS)
              if rel == ENCRYPTED:
                  counts['encrypted'] += 1
                  continue

              data = path.read_bytes()
              entry = patches.get(rel)
              if entry:
                  counts['patched_files'] += 1
                  try:
                      data = repair.apply(data, entry[1], expect_sha=entry[0])
                  except repair.PatchError:
                      counts['patch_failed'] += 1
                      continue

              try:
                  root = LE.fromstring(data)
              except LE.XMLSyntaxError:
                  counts['unparseable_after_repair'] += 1
                  continue

              counts['parseable_after_repair'] += 1
              if root.find('body/div1/text') is None:
                  counts['no_text_element'] += 1
                  continue

              counts['converter_documents'] += 1
              el = root.find('AOHeader/docID')
              if el is None:
                  counts['docid_element_missing'] += 1
                  raw = None
                  ex('missing', rel)
              else:
                  counts['docid_element_present'] += 1
                  if len(el):
                      counts['docid_with_child_elements'] += 1
                      ex('nested', rel, el.text, [child.tag for child in el])
                  raw = root.findtext('AOHeader/docID')
                  if raw is None:
                      # Defensive: distinguish an existing element whose parsed text is None.
                      counts['docid_findtext_none_present'] += 1
                  else:
                      raw_values[raw] += 1

              stem = Path(rel).stem
              current_docid = (raw or stem).strip()
              # Current artifact writes docid_raw=current_docid.
              current_docid_raw = current_docid

              if raw is None:
                  # Candidate A: missing source value represented by empty string.
                  counts['candidate_empty_for_missing_changes_current'] += int(current_docid_raw != '')
                  # Candidate B: feature omitted for missing source value cannot be compared as a string;
                  # record the population separately for plan-stage policy.
              else:
                  if raw == '':
                      counts['docid_empty_string'] += 1
                      ex('empty', rel, raw)
                  elif raw.strip() == '':
                      counts['docid_whitespace_only'] += 1
                      ex('whitespace_only', rel, raw)
                  if raw != raw.strip():
                      counts['docid_trim_diff'] += 1
                      trim_deltas[(len(raw) - len(raw.lstrip()), len(raw) - len(raw.rstrip()))] += 1
                      ex('trim_diff', rel, raw, f'stripped={raw.strip()!r}')
                  if any(ch in raw for ch in ('\t', '\n', '\r')):
                      counts['docid_tab_newline_cr'] += 1
                      ex('special_ws', rel, raw)
                  if raw != current_docid_raw:
                      counts['candidate_preserve_present_raw_changes_current'] += 1

              if not raw:
                  counts['current_filename_fallback'] += 1
                  ex('fallback', rel, raw, f'current_docid={current_docid!r}')
              if raw is not None and raw.strip() == '' and raw != '':
                  counts['current_blank_docid_from_whitespace_only'] += int(current_docid == '')

              if current_docid == stem:
                  counts['current_docid_equals_filename_stem'] += 1

          assert counts['source_xml'] == len(files)
          assert counts['patch_failed'] == 0
          assert counts['converter_documents'] == 23884, counts
          assert counts['converter_documents'] + counts['encrypted'] + counts['unparseable_after_repair'] + counts['no_text_element'] == counts['source_xml'], counts

          def n(key):
              return f"{counts[key]:,}"

          def table_examples(kind):
              items = examples[kind]
              if not items:
                  return '_None observed._\n'
              lines = ['| path | parsed value / note |', '|---|---|']
              for item in items:
                  text = item.get('raw_repr', '')
                  if item.get('extra') is not None:
                      text = (text + ' — ' if text else '') + str(item['extra'])
                  text = text.replace('|', '\\|')
                  lines.append(f"| `{item['path']}` | `{text}` |")
              return '\n'.join(lines) + '\n'

          trim_summary = ', '.join(
              f"lead={a}, trail={b}: {c:,}" for (a, b), c in sorted(trim_deltas.items())
          ) or 'none'

          report = f'''# Research: `docid_raw` semantics in TLHdig Beta 0.3

This report is an empirical prerequisite for issue #10. It was generated from the pinned
TLHdig Beta 0.3 corpus on the `research/docid-raw` branch **before any production or test
change for Phase 4**.

## Question

The converter currently computes:

```python
docid = (root.findtext("AOHeader/docID") or Path(rel).stem).strip()
docid_raw = docid
```

The second assignment means `docid_raw` is normalized/fallback-derived rather than source-derived.
Before changing it, we need to know what the source actually contains and which edge cases matter.

## Method

The measurement follows the converter input boundary rather than scanning only parse-clean raw XML:

1. enumerate `corpus_files()` from the pinned corpus;
2. skip the known encrypted record exactly as the converter does;
3. apply `patches.yaml` with the published expected SHA before parsing;
4. parse with `lxml.etree`;
5. exclude records still unparseable after repair and records with no `body/div1/text`;
6. on each record that would become a `document`, inspect `AOHeader/docID` with both
   `find()` (presence) and `findtext()` (the same parsed-text API the converter uses).

Here **raw means parsed XML element text before `.strip()` and before filename fallback**.
It does **not** mean the byte-for-byte `<docID>...</docID>` markup. XML entity expansion and
XML parser line-ending rules have already happened at this boundary.

## Population

| category | count |
|---|---:|
| source `*.xml` records | {n('source_xml')} |
| files with repair-manifest entries | {n('patched_files')} |
| encrypted exclusions | {n('encrypted')} |
| unparseable after approved repairs | {n('unparseable_after_repair')} |
| missing text element | {n('no_text_element')} |
| **converter document population** | **{n('converter_documents')}** |

The converter-document count is asserted to equal 23,884, matching TF 0.2.0.

## `<docID>` observations on converter documents

| observation | count |
|---|---:|
| `<docID>` element present | {n('docid_element_present')} |
| `<docID>` element missing | {n('docid_element_missing')} |
| present element with `findtext() is None` | {n('docid_findtext_none_present')} |
| parsed value is exactly empty string | {n('docid_empty_string')} |
| parsed value is non-empty but whitespace-only | {n('docid_whitespace_only')} |
| parsed value differs from `.strip()` | {n('docid_trim_diff')} |
| parsed value contains TAB/LF/CR | {n('docid_tab_newline_cr')} |
| `<docID>` has child elements | {n('docid_with_child_elements')} |
| current filename-fallback cases (`not raw`) | {n('current_filename_fallback')} |
| current `docid` is blank because raw is whitespace-only | {n('current_blank_docid_from_whitespace_only')} |
| current `docid` happens to equal filename stem | {n('current_docid_equals_filename_stem')} |

Trim-delta distribution: **{trim_summary}**.

## Artifact impact under candidate policies

This section measures consequences; it does not choose the policy.

- If a **present** `<docID>` stores its parsed text verbatim in `docid_raw`,
  **{n('candidate_preserve_present_raw_changes_current')}** document values would differ from TF 0.2.0's
  current `docid_raw=docid` behavior.
- If a **missing** `<docID>` is represented by the empty string, an additional
  **{n('candidate_empty_for_missing_changes_current')}** values would differ from current fallback-derived
  `docid_raw`. Omitting the feature instead is a distinct plan-stage option.
- Missing/empty values that trigger current filename fallback: **{n('current_filename_fallback')}**.

Therefore the plan must not assume this is metadata-only: whether a new artifact is needed depends
on these measured populations and on the chosen missing/empty representation.

## Examples where raw text differs from normalized `docid`

{table_examples('trim_diff')}
## Missing `<docID>` examples

{table_examples('missing')}
## Empty `<docID>` examples

{table_examples('empty')}
## Whitespace-only `<docID>` examples

{table_examples('whitespace_only')}
## TAB/newline/carriage-return examples

{table_examples('special_ws')}
## Current filename-fallback examples

{table_examples('fallback')}
## Nested-content examples

{table_examples('nested')}
## Constraints for the implementation plan

1. Preserve the existing `docid` expression and its observable behavior in this ticket;
   whitespace-only behavior is recorded above, not silently repaired here.
2. `docid_raw` must be source-derived. A filename fallback is useful for `docid`, but calling
   that fallback value `raw` is semantically false.
3. Missing element and present-empty element are distinguishable at the XML API boundary even if
   Text-Fabric ultimately chooses the same representation; the plan must state the choice explicitly.
4. TAB/LF/CR counts above determine whether current corpus data needs a serialization escape policy.
   Future-source robustness may still justify a synthetic round-trip test even when the count is zero.
5. This ticket must not change section addressing, duplicate grouping, or introduce a record ID.
'''
          Path('docs/research-docid-raw.md').write_text(report, encoding='utf8')
          print(report)
          PY
      - name: Commit research only and remove helper
        run: |
          rm .github/workflows/research-docid-raw.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/research-docid-raw.md
          git add -u .github/workflows/research-docid-raw.yml
          git diff --cached --check
          git commit -m 'Research docID raw-value semantics'
          git push origin HEAD:research/docid-raw
