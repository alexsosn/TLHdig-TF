name: Refresh Contract-A current manifest #142

# One-shot validation after rebasing #142 onto merged Phase 1. Remove before merge.
on:
  push:
    branches:
      - research/contract-a-exceptions-142
    paths:
      - ".github/workflows/refresh-contract-a-142.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt

      - name: Validate exact merged current artifact
        shell: bash
        run: |
          export TLHDIG_CODE_COMMIT="$(git rev-parse HEAD)"
          python programs/validate_current.py
          python programs/check_build_manifest.py

      - name: Assert manifest-only generated delta
        shell: bash
        run: |
          git restore --worktree --staged reports 2>/dev/null || true
          git status --short
          changed="$(git status --porcelain --untracked-files=no | awk '{print $2}')"
          if [ "$changed" != "tf/0.4.0/BUILD-MANIFEST.json" ]; then
            echo "Unexpected tracked delta after current validation:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit refreshed manifest
        shell: bash
        run: |
          git add -f tf/0.4.0/BUILD-MANIFEST.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh current manifest after Phase 1 merge (#142)"
          git push origin HEAD:research/contract-a-exceptions-142
