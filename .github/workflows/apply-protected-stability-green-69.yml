name: Apply protected-tree stability GREEN 69

on:
  push:
    branches:
      - research/certification-freshness-69
    paths:
      - ".github/workflows/apply-protected-stability-green-69.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/certification-freshness-69
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Apply narrow verifier and fixture fix
        run: |
          python - <<'PY'
          from pathlib import Path

          stamp = Path("programs/tlhdig/stamp.py")
          text = stamp.read_text(encoding="utf8")
          old = '''    if manifest.get("inputsStable") is not True:\n        return f"{CERTIFICATION} does not record stable release inputs"\n\n    problem = _protected_tree_problem(manifest.get("protectedTree"), contract, repo_root)\n'''
          new = '''    if manifest.get("inputsStable") is not True:\n        return f"{CERTIFICATION} does not record stable release inputs"\n    requires_protected_tree = (\n        contract.protected_tree_algorithm is not None\n        or contract.protected_tree_profile is not None\n    )\n    if requires_protected_tree and manifest.get("protectedTreeStable") is not True:\n        return f"{CERTIFICATION} does not record protectedTreeStable=true"\n\n    problem = _protected_tree_problem(manifest.get("protectedTree"), contract, repo_root)\n'''
          assert text.count(old) == 1, text.count(old)
          stamp.write_text(text.replace(old, new), encoding="utf8")

          tests = Path("programs/tests/test_release_certification_freshness_v6.py")
          text = tests.read_text(encoding="utf8")
          old = '''                "artifactStable": True,\n                "inputsStable": True,\n                "success": True,\n'''
          assert text.count(old) == 2, text.count(old)
          pos = text.rfind(old)
          new = '''                "artifactStable": True,\n                "inputsStable": True,\n                "protectedTreeStable": True,\n                "success": True,\n'''
          text = text[:pos] + text[pos:].replace(old, new, 1)
          tests.write_text(text, encoding="utf8")
          PY
      - name: Targeted adversarial GREEN
        run: >-
          python -m pytest -q
          programs/tests/test_protected_tree_stability_manifest_v6.py
          programs/tests/test_release_certification_freshness_v6.py
          programs/tests/test_stamp.py
          programs/tests/test_certification.py
      - name: Full unit suite
        run: python -m pytest programs/tests -q
      - name: Commit GREEN
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programs/tlhdig/stamp.py programs/tests/test_release_certification_freshness_v6.py
          git diff --cached --exit-code --quiet && { echo 'expected GREEN diff missing'; exit 1; } || true
          git commit -m "Require protected-tree stability in release-v6 stamps"
          git push origin HEAD:research/certification-freshness-69
