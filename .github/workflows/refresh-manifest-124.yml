name: Refresh manifest 124

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    if: github.head_ref == 'fix/preflight-signmap-multi-124'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Validate current artifact under new preflight code
        env:
          TLHDIG_CODE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: python programs/validate_current.py
      - name: Verify generated manifest
        run: python programs/check_build_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-124-current
          path: tf/0.4.0/BUILD-MANIFEST.json
