name: Refresh manifest 124

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'fix/preflight-signmap-multi-124'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Regenerate and verify manifest
        env:
          TLHDIG_CODE_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python programs/validate_current.py
          python programs/check_build_manifest.py
      - name: Commit exact generated manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tf/0.4.0/BUILD-MANIFEST.json
          git diff --cached --quiet && exit 0
          git commit -m 'ci: commit validated #124 manifest'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
