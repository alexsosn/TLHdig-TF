name: Regenerate source recovery inventory

on:
  push:
    branches:
      - research/source-recovery-12
    paths:
      - ".github/workflows/source-recovery-regenerate.yml"
      - "programs/source_recovery_inventory.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q programs/tests/test_source_recovery_inventory.py -k "not checked_in_source_recovery_inventory_is_current and not reviewed_dispositions"
      - run: python programs/source_recovery_inventory.py --write
      - name: Commit regenerated inventory
        shell: bash
        run: |
          git add reports/source-recovery-inventory.json
          if git diff --cached --quiet; then
            echo "inventory unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: regenerate compact #12 inventory"
          git push origin HEAD:research/source-recovery-12
