name: Research candidate alignment delta (#21)
on:
  push:
    branches: [fix/mixed-damage-compound-21]
    paths:
      - .github/workflows/research-alignment-delta-21.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Synthetic RED regressions and independent brute-force oracle
        run: python -m pytest programs/tests/test_mixed_damage_compound.py programs/tests/test_research_alignment_delta.py -q
      - name: Snapshot exact pre-change TF identities and sign features
        run: |
          mkdir -p /tmp/tlhdig-before
          cp tf/0.4.0/cu_sign.tf /tmp/tlhdig-before/
          cp tf/0.4.0/cu_aligned.tf /tmp/tlhdig-before/
          cp tf/0.4.0/cu_method.tf /tmp/tlhdig-before/
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, "programs")
          from tlhdig import TF_VERSION, PROVENANCE_DIR, build_manifest
          from tlhdig.paths import ROOT
          data = build_manifest.output_identity(
              ROOT / "tf" / TF_VERSION,
              ROOT / PROVENANCE_DIR / TF_VERSION,
          )
          Path("/tmp/tlhdig-before.json").write_text(
              json.dumps(data, sort_keys=True), encoding="utf8"
          )
          print("Recorded", len(data["files"]), "protected/current files")
          PY
      - name: Rebuild candidate against all pinned TLHdig sources
        run: python programs/build.py
      - name: Fetch locked external sign references (hard completeness)
        run: python programs/fetch_signrefs.py --mode release
      - name: Measure every changed assignment against independent reference lists
        run: |
          python programs/research_alignment_delta.py \
            --before /tmp/tlhdig-before \
            --baseline /tmp/tlhdig-before.json \
            --after tf/0.4.0
      - name: Test candidate alignment coverage and independent sign references
        run: |
          python programs/check_alignment.py
          python programs/check_signrefs.py --mode release
      - name: Validate complete candidate current artifact
        run: python programs/validate_current.py
      - name: Upload full review evidence even on gate failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alignment-candidate-21
          path: |
            reports/
            tf/0.4.0/BUILD-MANIFEST.json
          if-no-files-found: warn
