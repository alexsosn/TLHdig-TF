name: Materialize header provenance 0.5.0

on:
  push:
    branches:
      - "research/header-provenance-57"
    paths:
      - ".github/workflows/materialize-header-provenance-0.5.yml"

permissions:
  contents: write

# This is intentionally a one-shot artifact materializer.  It does not certify the
# release: the normal branch-scoped canonical certifier owns that after the artifact
# commit lands.  A stale/non-fast-forward publication fails rather than rebasing.
concurrency:
  group: materialize-header-provenance-0.5
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/header-provenance-57
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Fail closed if immutable 0.5.0 already exists
        run: |
          test ! -e tf/0.5.0
          test ! -e tf-provenance/0.5.0
          test -d tf/0.4.0
          test -d tf-provenance/0.4.0

      - name: Project the selected current release into user-facing metadata
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf8")
              got = text.count(old)
              if got != count:
                  raise SystemExit(
                      f"{path}: expected {count} occurrence(s), found {got}: {old!r}"
                  )
              p.write_text(text.replace(old, new, count), encoding="utf8")

          replace(
              "README.md",
              "**Current TF version: `0.4.0` — integration prototype.",
              "**Current TF version: `0.5.0` — integration prototype.",
          )
          replace(
              "README.md",
              "[`tf/0.4.0/`](tf/0.4.0)",
              "[`tf/0.5.0/`](tf/0.5.0)",
          )
          replace(
              "README.md",
              'TF = Fabric(locations="tf/0.4.0")',
              'TF = Fabric(locations="tf/0.5.0")',
          )
          replace(
              "README.md",
              "tf/0.4.0/               current generated Text-Fabric dataset",\n              "tf/0.5.0/               current generated Text-Fabric dataset",
          )
          replace(
              "README.md",
              "tf-provenance/0.4.0/    current optional source-provenance module",\n              "tf-provenance/0.5.0/    current optional source-provenance module",
          )
          replace(
              "README.md",
              "while `tfVersion = 0.4.0` identifies this conversion model and\nbuild.",
              "while `tfVersion = 0.5.0` identifies this conversion model and\nbuild.",
          )
          replace(
              "KNOWN-ISSUES.md",
              "# Known issues in `tf/0.4.0`",
              "# Known issues in `tf/0.5.0`",
          )
          replace("CITATION.cff", 'version: "0.4.0"', 'version: "0.5.0"')
          replace(
              "CITATION.cff",
              "current tf/0.4.0 build",
              "current tf/0.5.0 build",
          )
          replace(
              "docs/AGORA-INTEGRATION.md",
              'Fabric(locations="tf/0.4.0")',
              'Fabric(locations="tf/0.5.0")',
          )

      - name: Build immutable 0.5.0 artifact
        run: python programs/build.py

      - name: Regenerate feature reference from the new artifact
        run: python programs/build_feature_docs.py

      - name: Full unit and adversarial suite against materialized 0.5.0
        run: python -m pytest programs/tests -q

      - name: Enforce narrow materialization diff
        shell: python
        run: |
          import subprocess

          changed = subprocess.check_output(
              ["git", "status", "--porcelain=v1"], text=True
          ).splitlines()
          bad = []
          for row in changed:
              path = row[3:]
              # Renames are not expected here; reject them rather than misparse the path.
              if " -> " in path:
                  bad.append(row)
                  continue
              if path in {
                  "README.md",
                  "KNOWN-ISSUES.md",
                  "CITATION.cff",
                  "docs/AGORA-INTEGRATION.md",
              }:
                  continue
              if path.startswith(("tf/0.5.0/", "tf-provenance/0.5.0/", "docs/features/")):
                  continue
              bad.append(row)
          if bad:
              raise SystemExit("unexpected materialization changes:\n" + "\n".join(bad))

      - name: Commit materialized artifact without certification evidence
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md KNOWN-ISSUES.md CITATION.cff docs/AGORA-INTEGRATION.md docs/features tf/0.5.0 tf-provenance/0.5.0
          git diff --cached --check
          git commit -m "Materialize Text-Fabric 0.5.0 header provenance release"
          git push origin "HEAD:refs/heads/research/header-provenance-57"
