name: Researcher docs examples

on:
  pull_request:
    paths:
      - docs/querying.md
      - programs/tests/test_docs_examples.py
      - .github/workflows/docs-examples.yml
      - tf/**
      - requirements.txt
  push:
    branches:
      - main
    paths:
      - docs/querying.md
      - programs/tests/test_docs_examples.py
      - .github/workflows/docs-examples.yml
      - tf/**
      - requirements.txt

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Execute curated current-artifact examples
        env:
          TLHDIG_EXECUTE_DOC_EXAMPLES: '1'
        run: python -m pytest programs/tests/test_docs_examples.py -q
