name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      # The unit suite includes programs/tests/test_shard.py, which builds a real TF
      # dataset from documents chosen for constructs that have actually broken.
      - name: Unit tests, including the adversarial integration shard
        run: python -m pytest programs/tests -q

      # A clean user with no checkout specifier must not silently receive a stale
      # generated artifact (#47). Ordinary CI may report an availability skip;
      # complete current-build validation uses --mode release.
      - name: Bare acquisition resolves the current artifact
        run: python programs/check_distribution.py --mode ordinary

      - name: Show clean-user acquisition state
        if: always()
        run: |
          if [ -f reports/distribution-status.json ]; then
            cat reports/distribution-status.json
          else
            echo 'reports/distribution-status.json was not produced'
          fi

      # Fail fast on a known stale public release before expensive corpus gates.
      - name: TLHdig web-link identity safety
        run: python programs/research_weblink_ids.py --expect-duplicate-count 141 --expect-normalization-only-collision-count 25 --summary

      # Source identity is pinned independently of generated output.
      - name: Corpus identity
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "programs")
          from tlhdig import corpusid
          from tlhdig.paths import CORPUS, PROGRAMS
          problems = corpusid.verify(CORPUS, corpusid.read_manifest(PROGRAMS / "corpus.sha256"))
          for p in problems[:20]:
              print(p)
          sys.exit(1 if problems else 0)
          PY

      - name: Repair manifest still applies
        run: python programs/verify_patches.py

      - name: Sign round-trip (source -> signs -> source)
        run: python programs/check_signs.py

      - name: Morphology parse gate
        run: python programs/check_morph.py

      - name: Morphology control normalization
        run: python programs/check_mrp_controls.py

      - name: App config matches the dataset
        run: python programs/check_app.py

      - name: Feature reference matches the shipped dataset
        run: python programs/build_feature_docs.py --check

      - name: Every AOxml element has a declared destination
        run: |
          python programs/check_tags.py
          git diff --exit-code -- reports/tags.md

      - name: Provenance split loses nothing
        run: python programs/check_provenance_split.py

      - name: Cuneiform alignment coverage holds
        run: python programs/check_alignment.py

      # External data stay transient and git-ignored. Ordinary CI may report an
      # availability skip; complete current-build validation uses --mode release.
      - name: Fetch locked external sign lists
        run: python programs/fetch_signrefs.py --mode ordinary

      - name: Outside sign lists still parse and alignment holds
        run: python programs/check_signrefs.py --mode ordinary

      - name: Show external sign-reference state
        if: always()
        run: |
          if [ -f reports/signrefs-status.json ]; then
            cat reports/signrefs-status.json
          else
            echo 'reports/signrefs-status.json was not produced'
          fi

      - name: Verify committed current-build manifest
        run: python programs/check_build_manifest.py

  # Temporary #174 diagnostic job. It never publishes or pushes a generated graph.
  # Ordinary CI remains intact; this uses a scratch candidate manifest only.
  beta04-migration-diagnostics:
    if: github.event_name == 'pull_request' && (github.head_ref == 'upstream/beta-0.4-import' || github.head_ref == 'upstream/beta-0.4-recovery-tail')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Focused recovery and coordinate regression gates
        run: |
          python -m pytest -q programs/tests/test_beta04_namespace_repair.py programs/tests/test_beta04_gap_repairs.py programs/tests/test_beta04_kub50123.py
      - name: Verify the active repair and exclusion manifests
        run: |
          python programs/check_corpus_identity.py
          python programs/verify_patches.py
          python -m pytest -q programs/tests/test_beta04_gap_repairs.py -k active_manifest
          cp programs/patches.yaml /tmp/beta04-candidate-patches.yaml
          cp programs/excluded.txt /tmp/beta04-candidate-excluded.txt
      - name: Measure sign-language source baseline without reading TF
        run: |
          PYTHONPATH=programs python - <<'PY'
          import json, hashlib
          from pathlib import Path
          from check_sign_language import _source_documents
          expected, stats, raw, problems = _source_documents()
          result = {"source_version":"0.4",
            "corpus_manifest_sha256":hashlib.sha256(Path("programs/corpus.sha256").read_bytes()).hexdigest(),
            "repair_manifest_sha256":hashlib.sha256(Path("programs/patches.yaml").read_bytes()).hexdigest(),
            "statistics":dict(stats), "problems":problems}
          Path("/tmp/beta04-source-baseline.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          assert not problems, problems[:20]
          assert len(expected) == stats["documents"] == 24128
          PY
      - name: Save independent source evidence before conversion
        uses: actions/upload-artifact@v4
        with:
          name: beta04-source-evidence
          path: |
            /tmp/beta04-candidate-patches.yaml
            /tmp/beta04-candidate-excluded.txt
            /tmp/beta04-source-baseline.json
      - name: Full candidate conversion (no release)
        run: |
          set -o pipefail
          python programs/build.py 2>&1 | tee /tmp/beta04-build.log
      - name: Save conversion evidence before validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta04-conversion-evidence
          path: /tmp/beta04-build.log
      - name: Measure every existing release gate without issuing build manifest
        run: |
          PYTHONPATH=programs python - <<'PY'
          import json
          from pathlib import Path
          from validate_current import GATES, run_gate
          results = {}
          for gate in GATES:
              outcome = run_gate(gate)
              results[gate.name] = {"status": outcome.status, "returncode": outcome.returncode}
              Path("/tmp/beta04-gates.json").write_text(json.dumps(results,indent=2)+"\n")
          print(json.dumps(results,indent=2))
          assert all(x["status"]=="passed" and x["returncode"]==0 for x in results.values())
          PY
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta04-migration-diagnostics
          path: |
            /tmp/beta04-candidate-patches.yaml
            /tmp/beta04-candidate-excluded.txt
            /tmp/beta04-source-baseline.json
            /tmp/beta04-build.log
            /tmp/beta04-gates.json
            reports/
