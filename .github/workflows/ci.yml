name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      # Temporary bootstrap evidence for issue #22. This prints metadata/hashes only,
      # never the third-party source. It is removed as soon as signrefs.lock.json is set.
      - name: Probe pinned Wiktionary sign-list revision
        run: |
          python - <<'PY'
          import hashlib, json
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          revision = "83078078"
          query = urlencode({
              "action": "query", "format": "json", "formatversion": "2",
              "prop": "revisions", "revids": revision,
              "rvprop": "ids|sha1|slotsha1|content", "rvslots": "main",
          })
          request = Request(
              "https://en.wiktionary.org/w/api.php?" + query,
              headers={"User-Agent": "TLHdig-TF signref lock probe/1"},
          )
          with urlopen(request, timeout=30) as response:
              payload = json.load(response)
          rev = payload["query"]["pages"][0]["revisions"][0]
          slot = rev["slots"]["main"]
          data = slot["content"].encode("utf8")
          digest = hashlib.sha1(data).digest()
          n = int.from_bytes(digest, "big")
          alphabet = "0123456789abcdefghijklmnopqrstuvwxyz"
          base36 = ""
          while n:
              n, remainder = divmod(n, 36)
              base36 = alphabet[remainder] + base36
          print(f"revid={rev['revid']}")
          print(f"revision_sha1={rev.get('sha1')}")
          print(f"slot_sha1={slot.get('sha1')}")
          print(f"content_hex_sha1={digest.hex()}")
          print(f"content_base36_sha1={base36.rjust(31, '0')}")
          print(f"content_bytes={len(data)}")
          PY

      # The unit suite includes programs/tests/test_shard.py, which builds a real TF
      # dataset from 91 documents chosen for the constructs that have actually broken
      # and compares a source census with a graph census. Every serious defect here has
      # been an integration bug that unit tests passed; this is the check that catches
      # that class on every push, in about 13 seconds.
      - name: Unit tests, including the adversarial integration shard
        run: python -m pytest programs/tests -q

      # The corpus is an immutable release; a changed or missing source file must fail
      # here rather than quietly lower every downstream count.
      - name: Corpus identity
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "programs")
          from tlhdig import corpusid
          from tlhdig.paths import CORPUS, PROGRAMS
          problems = corpusid.verify(CORPUS, corpusid.read_manifest(PROGRAMS / "corpus.sha256"))
          for p in problems[:20]:
              print(p)
          sys.exit(1 if problems else 0)
          PY

      - name: Repair manifest still applies
        run: python programs/verify_patches.py

      - name: Sign round-trip (source -> signs -> source)
        run: python programs/check_signs.py

      - name: Morphology parse gate
        run: python programs/check_morph.py

      # The dataset is committed, so this can run in CI: it reads the shipped .tf files
      # directly and takes under a second.  TF itself only validates app/config.yaml when
      # use() loads the corpus -- 12 minutes and 5 GB -- and a features: entry naming a
      # feature that does not apply to the node type never raises at all, it just renders
      # as nothing.  Two such entries were in the first draft of the config.
      - name: App config matches the dataset
        run: python programs/check_app.py

      # The stamp is bound to a digest of the .tf files, so this catches a dataset
      # committed after the census that verified it -- build.py rebuilds in place.
      - name: Build stamp certifies the committed dataset
        run: python programs/check_stamp.py

      # Contract B: an element nobody declared a destination for fails here rather than
      # passing silently into srcxml with its meaning invisible.
      - name: Every AOxml element has a declared destination
        run: python programs/check_tags.py

      # The provenance module can only be separated if `srcxml` is the sole record of
      # nothing. Two passes each found survivors -- 212 signs holding a long-form
      # AO:Sumgram, then 149 holding ras_X / AkkGLOS / PARSER_ERROR / leaked ODF
      # styling. This stops a third going unnoticed.
      - name: Provenance split loses nothing
        run: python programs/check_provenance_split.py

      # Reads the .tf files directly, so it costs seconds. Coverage may rise freely;
      # a drop fails, because every mechanism behind it was justified by measurement.
      - name: Cuneiform alignment coverage holds
        run: python programs/check_alignment.py

      # The external witness. `refs/` is git-ignored -- the sign lists' licences run
      # from MIT to AGPL and are not redistributed here -- so in CI this skips with a
      # note rather than failing. It is a local and release gate; the step exists so
      # that a broken loader is caught, and so the skip is visible in the log.
      - name: Outside sign lists still parse
        run: python programs/check_signrefs.py
