name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      # The unit suite includes programs/tests/test_shard.py, which builds a real TF
      # dataset from documents chosen for constructs that have actually broken.
      - name: Unit tests, including the adversarial integration shard
        run: python -m pytest programs/tests -q

      # Pilot source-event outputs must also survive an independent reader of
      # loaded, serialized TF. Existing global gates still use repaired XML.
      # This builds four ephemeral, signed, explicitly opted-in source graphs;
      # it never modifies the committed corpus or artifact manifest.
      - name: Independent reviewed source-event recovery gate
        run: python programs/check_recovery_source.py

      - name: TLHdig web-link identity safety
        run: python programs/research_weblink_ids.py --expect-duplicate-count 141 --expect-normalization-only-collision-count 25 --summary

      # Source identity is pinned independently of generated output.
      - name: Corpus identity
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "programs")
          from tlhdig import corpusid
          from tlhdig.paths import CORPUS, PROGRAMS
          problems = corpusid.verify(CORPUS, corpusid.read_manifest(PROGRAMS / "corpus.sha256"))
          for p in problems[:20]:
              print(p)
          sys.exit(1 if problems else 0)
          PY

      - name: Repair manifest still applies
        run: python programs/verify_patches.py

      - name: Sign round-trip (source -> signs -> source)
        run: python programs/check_signs.py

      - name: Morphology parse gate
        run: python programs/check_morph.py

      - name: Morphology control normalization
        run: python programs/check_mrp_controls.py

      - name: App config matches the dataset
        run: python programs/check_app.py

      - name: Feature reference matches the shipped dataset
        run: python programs/build_feature_docs.py --check

      - name: Every AOxml element has a declared destination
        run: |
          python programs/check_tags.py
          git diff --exit-code -- reports/tags.md

      - name: Provenance split loses nothing
        run: python programs/check_provenance_split.py

      - name: Cuneiform alignment coverage holds
        run: python programs/check_alignment.py

      # External data stay transient and git-ignored. Ordinary CI may report an
      # availability skip; complete current-build validation uses --mode release.
      - name: Fetch locked external sign lists
        run: python programs/fetch_signrefs.py --mode ordinary

      - name: Outside sign lists still parse and alignment holds
        run: python programs/check_signrefs.py --mode ordinary

      - name: Show external sign-reference state
        if: always()
        run: |
          if [ -f reports/signrefs-status.json ]; then
            cat reports/signrefs-status.json
          else
            echo 'reports/signrefs-status.json was not produced'
          fi

      - name: Verify committed current-build manifest
        run: python programs/check_build_manifest.py

  # Temporary diagnostic while PR #152 remains a draft. It tests the *actual*
  # full corpus; ordinary CI's signed four-source shard cannot establish that
  # the production build, compaction, provenance split and full release gates
  # agree. This runner is disposable: NEVER commit/upload/restamp the resulting
  # generated corpus or add old-version TF snapshots to the repository.
  # Remove this temporary PR-specific job before an eventual merge.
  full-corpus-recovery-diagnostic:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 152
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install converter and Text-Fabric dependencies
        run: pip install -r requirements.txt
      - name: Build full current corpus with reviewed original-source recovery
        run: python -u programs/build.py
      - name: Audit recovered originals in actual compacted split TF corpus
        run: python -u programs/check_recovery_current.py
      - name: Run every complete current-artifact release validation gate
        run: python -u programs/validate_current.py
