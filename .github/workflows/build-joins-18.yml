name: Build joins artifact 18

on:
  push:
    branches: [research/joins-18]
    paths:
      - .github/workflows/build-joins-18.yml

permissions:
  contents: write

jobs:
  build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Require a new immutable output directory
        run: test ! -e tf/0.3.0 && test ! -e tf-provenance/0.3.0
      - name: Build immutable tf/0.3.0 from corrected manuscript gate head
        run: python programs/build.py
      - name: Full unit and adversarial integration suite on built artifact
        run: PYTHONPATH=programs python -m pytest programs/tests -q
      - name: Independent manuscript source-to-graph conservation
        run: python programs/check_manuscript_joins.py
      - name: Fresh-process dataset census
        run: python programs/census.py
      - name: App schema matches built artifact
        run: python programs/check_app.py
      - name: Historical immutable artifacts are untouched
        run: git diff --exit-code -- tf/0.1.0 tf/0.2.0 tf-provenance/0.1.0 tf-provenance/0.2.0
      - name: Commit audited immutable artifact and remove build workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/build-joins-18.yml
          git add -f tf/0.3.0 tf-provenance/0.3.0
          git add reports/manuscript-joins.md reports/census.md .github/workflows/build-joins-18.yml
          git commit -m "Build audited Text-Fabric 0.3.0 manuscript graph"
          git push origin HEAD:research/joins-18
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: joins-build-audit-18
          path: |
            reports/manuscript-joins.md
            reports/census.md
