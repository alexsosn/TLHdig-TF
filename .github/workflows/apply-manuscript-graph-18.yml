name: Apply manuscript graph 18

on:
  push:
    branches: [research/joins-18]
    paths: [.github/workflows/apply-manuscript-graph-18.yml]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joins-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Apply narrow production integration
        run: python programs/apply_manuscript_graph_integration.py
      - name: Exercise graph contract
        id: graph
        shell: bash
        run: |
          set +e
          PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_graph.py -q 2>&1 | tee graph-green-18.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Preserve failing graph diagnostics
        if: steps.graph.outputs.status != '0'
        run: |
          git restore programs/tlhdig/convert.py programs/tlhdig/featuremeta.py
          git add graph-green-18.log
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'Record manuscript graph GREEN failure'
          git push origin HEAD:research/joins-18
      - name: Fail after preserving diagnostics
        if: steps.graph.outputs.status != '0'
        run: exit 1
      - name: Parser contract stays GREEN
        if: steps.graph.outputs.status == '0'
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscripts.py -q
      - name: Corpus parser conservation stays GREEN
        if: steps.graph.outputs.status == '0'
        run: python programs/check_manuscripts_parser.py
      - name: Diff sanity
        if: steps.graph.outputs.status == '0'
        run: git diff --check
      - name: Commit GREEN implementation and remove one-shot machinery
        if: steps.graph.outputs.status == '0'
        run: |
          rm programs/apply_manuscript_graph_integration.py .github/workflows/apply-manuscript-graph-18.yml
          rm -f graph-green-18.log
          git add programs/tlhdig/convert.py programs/tlhdig/featuremeta.py programs/apply_manuscript_graph_integration.py .github/workflows/apply-manuscript-graph-18.yml graph-green-18.log
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'Integrate source-faithful manuscript join graph'
          git push origin HEAD:research/joins-18
