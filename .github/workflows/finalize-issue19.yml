name: Finalize issue 19 generated feature docs

on:
  push:
    paths:
      - ".github/workflows/finalize-issue19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Require the immutable 0.4.0 artifact
        run: |
          test -f tf/0.4.0/otype.tf
          test -f tf-provenance/0.4.0/srcxml.tf
      - name: Regenerate feature reference from 0.4.0
        run: python programs/build_feature_docs.py
      - name: Verify generated feature reference
        run: python programs/build_feature_docs.py --check
      - name: Commit generated feature reference only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git fetch origin research/sign-lang-19
          test "$(git rev-parse origin/research/sign-lang-19)" = "$GITHUB_SHA"

          git add docs/features/
          staged_paths="$(git diff --cached --name-only)"
          test -n "$staged_paths"
          if printf '%s\n' "$staged_paths" | grep -Ev '^docs/features/' >/dev/null; then
            echo "Refusing to stage anything except generated feature docs" >&2
            printf '%s\n' "$staged_paths" >&2
            exit 1
          fi

          git commit -m "Refresh feature reference for Text-Fabric 0.4.0"
          git push origin HEAD:research/sign-lang-19
