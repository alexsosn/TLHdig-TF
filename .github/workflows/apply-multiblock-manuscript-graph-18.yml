name: Apply multi-block manuscript graph 18

on:
  push:
    branches: [research/joins-18]
    paths:
      - programs/apply_multiblock_manuscript_graph.py
      - programs/patch_multiblock_line_feature.py
      - .github/workflows/apply-multiblock-manuscript-graph-18.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Apply multi-block graph implementation
        run: python programs/apply_multiblock_manuscript_graph.py
      - name: Persist line manuscript block
        run: python programs/patch_multiblock_line_feature.py
      - name: Original parser contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscripts.py -q
      - name: Raw provenance contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_raw_provenance.py -q
      - name: Expanded parser scope contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_scope.py -q
      - name: Original graph regression contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_graph.py -q
      - name: Multi-block graph GREEN contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_multiblock_graph.py -q
      - name: Commit production graph integration
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm programs/apply_multiblock_manuscript_graph.py programs/patch_multiblock_line_feature.py .github/workflows/apply-multiblock-manuscript-graph-18.yml
          git add programs/tlhdig/convert.py programs/tlhdig/manuscript_graph.py programs/tlhdig/featuremeta.py programs/apply_multiblock_manuscript_graph.py programs/patch_multiblock_line_feature.py .github/workflows/apply-multiblock-manuscript-graph-18.yml
          git commit -m "Scope manuscript graph by source apparatus block"
          git push
