name: Release certification E2E

# Temporary PR-only proof for issue #24. Remove after the canonical release command has
# passed once in a clean hosted checkout; the durable full-build workflow is dataset.yml.
on:
  pull_request:
    branches: [main]

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Canonical regression-valid certification
        run: python programs/release_check.py --mode regression-valid
      - name: Publication verifier accepts the resulting full stamp
        run: python programs/check_stamp.py --require-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-certification-e2e-reports
          path: reports/
