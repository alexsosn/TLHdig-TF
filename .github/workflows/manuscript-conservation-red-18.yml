name: Manuscript conservation unit 18

on:
  push:
    branches: [research/joins-18]
    paths:
      - programs/tlhdig/manuscript_conservation.py
      - programs/tlhdig/release_policy.py
      - programs/release_check.py
      - programs/check_manuscript_joins.py
      - programs/tests/test_manuscript_conservation.py
      - programs/tests/test_manuscript_release_policy.py
      - .github/workflows/manuscript-conservation-red-18.yml

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            programs
            requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Independent manuscript conservation and release-policy contracts
        run: >-
          PYTHONPATH=programs python -m pytest
          programs/tests/test_manuscript_conservation.py
          programs/tests/test_manuscript_release_policy.py -q
