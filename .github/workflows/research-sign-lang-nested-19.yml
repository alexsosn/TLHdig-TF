name: Research nested language scope 19

on:
  push:
    paths:
      - ".github/workflows/research-sign-lang-nested-19.yml"
      - "programs/research_sign_lang_nested_scope_19.py"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Compare production-like and source-grammar language scopes
        run: python programs/research_sign_lang_nested_scope_19.py
      - uses: actions/upload-artifact@v4
        with:
          name: sign-lang-nested-19-research
          path: reports/research-sign-lang-nested-scope-19.json
          if-no-files-found: error
