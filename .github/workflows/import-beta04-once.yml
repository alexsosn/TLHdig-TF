name: Beta 0.4 full migration trial (temporary)
on:
  push:
    branches: [upstream/beta-0.4-import]
    paths: [.github/workflows/import-beta04-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migration:
    if: github.ref == 'refs/heads/upstream/beta-0.4-import'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Activate candidate source and commit exact inputs
        run: |
          python programs/stage_beta04_migration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- programs/corpus.sha256 programs/patches.yaml programs/excluded.txt programs/known_lossy.txt programs/contract_a_known.txt programs/tlhdig/__init__.py programs/tlhdig/paths.py programs/tlhdig/convert.py programs/build.py corpus/ATTRIBUTION.md
          git commit -m 'migration(#174): activate Beta 0.4 candidate source and exact repair policy'
          git push origin HEAD:refs/heads/upstream/beta-0.4-import
      - name: Source and repair preflight
        run: |
          python -m pytest -q programs/tests/test_repair.py programs/tests/test_beta04_namespace_repair.py
          python programs/check_corpus_identity.py
          python programs/verify_patches.py
      - name: Build full corpus using existing converter
        run: |
          set -o pipefail
          python programs/build.py 2>&1 | tee /tmp/beta04-build.log
      - name: Full existing validation (no gate bypass)
        run: |
          set -o pipefail
          export TLHDIG_CODE_COMMIT="$(git rev-parse HEAD)"
          python programs/validate_current.py 2>&1 | tee /tmp/beta04-validation.log
          python programs/check_build_manifest.py
      - name: Collect remaining gate diagnostics if validation fails
        if: failure()
        run: |
          if [ -f /tmp/beta04-validation.log ]; then
            PYTHONPATH=programs python - <<'PY'
          import json
          from pathlib import Path
          from validate_current import GATES, run_gate
          results = {}
          for gate in GATES:
              outcome = run_gate(gate)
              results[gate.name] = {"status": outcome.status, "returncode": outcome.returncode}
          Path('/tmp/beta04-gates.json').write_text(json.dumps(results, indent=2))
          PY
          fi
      - name: Save diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta04-full-build-evidence
          path: |
            /tmp/beta04-build.log
            /tmp/beta04-validation.log
            /tmp/beta04-gates.json
            reports/
            tf/*/BUILD-MANIFEST.json
      - name: Stage fully validated candidate only
        run: |
          bash programs/publish_dataset.sh
          git add -- reports
          git commit -m 'build(#174): stage fully validated Beta 0.4 candidate TF artifact'
          git push origin HEAD:refs/heads/upstream/beta-0.4-import
