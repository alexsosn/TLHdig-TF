name: Beta 0.4 migration audit (temporary)
on:
  push:
    branches: [upstream/beta-0.4-import]
    paths: [.github/workflows/import-beta04-once.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-repairs:
    if: github.ref == 'refs/heads/upstream/beta-0.4-import'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Run repair regression suite
        run: python -m pytest -q programs/tests/test_repair.py programs/tests/test_beta04_namespace_repair.py
      - name: Generate reviewed-source candidates (not active build policy)
        run: python programs/audit_beta04_repairs.py
      - name: Commit candidate audit evidence only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- programs/patches-beta04-candidate.yaml programs/excluded-beta04-candidate.txt reports/beta04-repair-audit.json
          git commit -m 'research(#174): record candidate repairs and unresolved XML files'
          git push origin HEAD:refs/heads/upstream/beta-0.4-import
      - name: Convert and load repaired subset through real TF API
        run: |
          PYTHONPATH=programs python - <<'PY'
          from pathlib import Path
          from tlhdig import repair, convert
          from tf.fabric import Fabric
          root = Path('corpus/TLHdig-0.4').resolve()
          patches = repair.read_manifest(Path('programs/patches-beta04-candidate.yaml'))
          ledger = convert.Ledger()
          target = Path('/tmp/beta04-repair-smoke')
          result = convert.build(root, target, files=[root/p for p in sorted(patches)],
              patches=patches, ledger=ledger, load=False, keep_empty=False)
          assert result is not None
          print(ledger.report())
          print(ledger.marker_report())
          assert ledger.converted == len(patches)
          assert ledger.marker_src == ledger.marker_fed == ledger.marker_out
          api = Fabric(locations=str(target), silent='deep').load('otype oslots src_file sym lnr', silent='deep')
          assert api
          assert {api.F.src_file.v(d) for d in api.F.otype.s('document')} == set(patches)
          assert api.F.otype.s('line') and api.F.otype.s('sign')
          print('Repair subset graph loaded:', len(api.F.otype.s('document')), 'documents')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta04-repair-audit
          path: |
            programs/patches-beta04-candidate.yaml
            programs/excluded-beta04-candidate.txt
            reports/beta04-repair-audit.json
