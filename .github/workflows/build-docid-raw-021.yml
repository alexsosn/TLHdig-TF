name: Build certified TF 0.2.1 docid_raw release

on:
  push:
    branches: [feat/docid-raw]
    paths: [.github/workflows/build-docid-raw-021.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/docid-raw
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Record immutable published trees
        run: |
          {
            echo "tf010=$(git rev-parse HEAD:tf/0.1.0)"
            echo "prov010=$(git rev-parse HEAD:tf-provenance/0.1.0)"
            echo "tf020=$(git rev-parse HEAD:tf/0.2.0)"
            echo "prov020=$(git rev-parse HEAD:tf-provenance/0.2.0)"
          } > /tmp/published-trees
          cat /tmp/published-trees

      - name: Validate committed release identity
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "programs")
          from tlhdig import SOURCE_VERSION, TF_VERSION
          assert SOURCE_VERSION == "0.3"
          assert TF_VERSION == "0.2.1"
          PY
          python -m pytest programs/tests/test_release_version.py -q
          test ! -e tf/0.2.1
          test ! -e tf-provenance/0.2.1

      - name: Unit and adversarial tests before rebuild
        run: python -m pytest programs/tests -q

      - name: Clean full rebuild
        run: python programs/build.py

      # The canonical procedure from docs/RELEASE.md. This replaces the hand-rolled gate
      # list and the bare census.py that preceded it: #28 made release_check.py the sole
      # writer of BUILD-COMPLETE, so census.py now writes no stamp at all, and the
      # publish_dataset.sh that same PR introduced runs check_stamp.py --require-full.
      # Without this step publication fails with "BUILD-COMPLETE is missing".
      # regression-valid is the documented release mode; research-ready would also demand
      # the fidelity baselines be zero, and they are 46 (known_lossy.txt), 16
      # (contract_a_known.txt) and 15 (structure.KNOWN_WORD_DEFICIT).
      - name: Full release certification
        run: python programs/release_check.py --mode regression-valid

      # release_policy.REQUIRED_GATES carries only contract-a-graph, so the canonical set
      # is not a strict superset of the list this replaced: it drops source-level
      # check_contract_a.py, kept here, and the bare check_stamp.py, which needs no
      # replacement because publish_dataset.sh runs the strictly stronger --require-full.
      - name: Source-level Contract A
        run: python programs/check_contract_a.py

      - name: Certify only docid_raw data changed
        run: python programs/check_docid_raw_release.py

      - name: Prove old release directories untouched
        run: |
          git diff --exit-code HEAD -- tf/0.1.0 tf-provenance/0.1.0 tf/0.2.0 tf-provenance/0.2.0

      - name: Stage certified release
        run: |
          bash programs/publish_dataset.sh
          git add reports/
          rm .github/workflows/build-docid-raw-021.yml
          git add -u .github/workflows/build-docid-raw-021.yml
          # Scoped to the hand-authored paths. The dataset is generated, not source, and
          # trailing whitespace is ordinary in it: the shipped 0.2.0 has ~36,000 such
          # lines, 35,384 of them in raw.tf alone, where a trailing space sits inside a
          # transliteration value. Others end in a separator tab because the value is the
          # empty string. Either way it is data, and it could not be stripped even if we
          # wanted to: stamp.py digests the raw bytes of every .tf file, so an edit here
          # invalidates the certification two steps up.
          git diff --cached --check -- reports/ .github/
          git status --short

      - name: Commit, verify immutable trees, and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'Build certified TF 0.2.1 artifact'
          . /tmp/published-trees
          test "$(git rev-parse HEAD:tf/0.1.0)" = "$tf010"
          test "$(git rev-parse HEAD:tf-provenance/0.1.0)" = "$prov010"
          test "$(git rev-parse HEAD:tf/0.2.0)" = "$tf020"
          test "$(git rev-parse HEAD:tf-provenance/0.2.0)" = "$prov020"
          git push origin HEAD:feat/docid-raw
