name: Apply current 0.2.0 documentation updates

on:
  push:
    branches: [feat/project-metadata]
    paths: ['.github/workflows/phase3-current-docs.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-metadata
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch only current operational documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf8')
              got = text.count(old)
              assert got == count, f'{path}: expected {count} occurrences, got {got}: {old!r}'
              p.write_text(text.replace(old, new), encoding='utf8')

          # README: current release paths/schema and canonical project example.
          replace('README.md', 'Current TF version: `0.1.0`', 'Current TF version: `0.2.0`)
          replace('README.md', '[`tf/0.1.0/`](tf/0.1.0)', '[`tf/0.2.0/`](tf/0.2.0)')
          replace('README.md', 'TF = Fabric(locations="tf/0.1.0")', 'TF = Fabric(locations="tf/0.2.0")')
          replace('README.md', '    "subcorpus type width docid collabel lnno"', '    "project subcorpus type width docid collabel lnno"')
          replace('README.md', 'by_subcorpus = Counter()', 'by_project = Counter()')
          replace('README.md', '        by_subcorpus[F.subcorpus.v(docs[0])] += 1', '        by_project[F.project.v(docs[0])] += 1')
          replace('README.md', 'print(by_subcorpus.most_common())', 'print(by_project.most_common())')
          replace('README.md', 'The build currently exposes 104 node features and 9 edge features', 'The build currently exposes 107 node features and 9 edge features')
          replace('README.md', 'tf/0.1.0/               generated Text-Fabric dataset', 'tf/0.2.0/               current generated Text-Fabric dataset')
          replace('README.md', 'tf-provenance/0.1.0/    optional source-provenance module', 'tf-provenance/0.2.0/    current optional source-provenance module')
          replace('README.md', 'while `tfVersion = 0.1.0` identifies this conversion model and\nbuild.', 'while `tfVersion = 0.2.0` identifies this conversion model and\nbuild.')

          # Known issues: current register is 0.2.0; keep 0.1.0 as explicit history.
          replace('KNOWN-ISSUES.md', '# Known issues in `tf/0.1.0`', '# Known issues in `tf/0.2.0`')
          replace(
              'KNOWN-ISSUES.md',
              'During the prototype phase `tf/0.1.0` has been rebuilt in place, so a bare version string\n'
              'does not identify every historical state of the dataset. Until the release is frozen,\n'
              'use the repository commit SHA as well when reproducibility matters.',
              'The historical `tf/0.1.0` prototype was rebuilt in place, so that bare version string does\n'
              'not identify every historical state. Starting with `0.2.0`, published release directories\n'
              'are immutable; for old `0.1.0` states, record the repository commit SHA as well.'
          )
          replace(
              'KNOWN-ISSUES.md',
              'need a persistent unambiguous identifier should retain the source-file / record identity\n'
              'as well.',
              'need an unambiguous identifier within one release should retain `src_file` as the\n'
              'release-scoped source-record identity as well; it is not persistent across releases.'
          )

          # Citation: current artifact identity. Preserve source citation separately.
          replace('CITATION.cff', 'type: software\n', 'type: software\nversion: "0.2.0"\n')
          replace('CITATION.cff', 'current tf/0.1.0 build', 'current tf/0.2.0 build')

          # Integration doc: update our direct-load contract only; quoted external Agora
          # registry pin stays tf/0.1.0 because it documents the stale external entry.
          replace('docs/AGORA-INTEGRATION.md', '`Fabric(locations="tf/0.1.0")` | no | no (any local path)', '`Fabric(locations="tf/0.2.0")` | no | no (any local path)')
          replace(
              'docs/AGORA-INTEGRATION.md',
              '* **The build remains an integration prototype.** The damage layer is independently\n'
              '  verified; `lex` is missing, 52 files do not parse, and 74 crossing-tag repairs are\n'
              '  unreviewed. See [KNOWN-ISSUES.md](../KNOWN-ISSUES.md).',
              '* **The build remains an integration prototype.** The damage and lexical layers are\n'
              '  present and independently checked where applicable; 52 files do not parse, and 74\n'
              '  crossing-tag repairs are unreviewed. See [KNOWN-ISSUES.md](../KNOWN-ISSUES.md).'
          )

          # Conversion plan has a current repository-layout/version example, not a
          # historical measurement, so it follows the current ontology version.
          replace('docs/TF-CONVERSION-PLAN.md', 'tf/0.1.0/        generated features', 'tf/0.2.0/        generated features')
          replace('docs/TF-CONVERSION-PLAN.md', 'tfVersion     = 0.1.0      # this ontology + converter', 'tfVersion     = 0.2.0      # this ontology + converter')
          PY
      - name: Commit and remove helper
        run: |
          rm .github/workflows/phase3-current-docs.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md KNOWN-ISSUES.md CITATION.cff docs/AGORA-INTEGRATION.md docs/TF-CONVERSION-PLAN.md
          git add -u .github/workflows/phase3-current-docs.yml
          git diff --cached --check
          git commit -m 'Update current documentation for TF 0.2.0'
          git push origin HEAD:feat/project-metadata
