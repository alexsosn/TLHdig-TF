# release-facing GREEN retry 7: exact-SHA, race-safe, cache-free staging
name: Build final issue 19 Text-Fabric 0.4.0

on:
  push:
    paths:
      - ".github/workflows/build-final-19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Assert immutable target is new
        run: |
          test ! -e tf/0.4.0
          test ! -e tf-provenance/0.4.0
      - name: Build immutable Text-Fabric 0.4.0
        run: python programs/build.py
      - name: Full unit suite
        run: python -m pytest programs/tests -q
      - name: Exact sign-language conservation
        run: python programs/check_sign_language.py
      - name: Structural regression gate
        run: python programs/check_structure.py
      - name: Manuscript graph regression gate
        run: python programs/check_manuscript_joins.py
      - name: Census
        run: python programs/census.py
      - name: App contract
        run: python programs/check_app.py
      - name: Historical artifact immutability
        run: |
          git diff --exit-code HEAD -- \
            tf/0.1.0 tf/0.2.0 tf/0.3.0 \
            tf-provenance/0.1.0 tf-provenance/0.2.0 tf-provenance/0.3.0
      - name: Commit immutable 0.4.0 artifact and evidence
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          # Text-Fabric may create runtime cache under the release directories.
          # It is not part of the immutable release artifact.
          rm -rf tf/0.4.0/.tf tf-provenance/0.4.0/.tf

          # Bind the artifact to the exact workflow-triggering branch head. If the
          # branch moved while this long build was running, fail closed rather
          # than rebasing or publishing an artifact built from stale code.
          git fetch origin research/sign-lang-19
          test "$(git rev-parse origin/research/sign-lang-19)" = "$GITHUB_SHA"

          git add -f tf/0.4.0 tf-provenance/0.4.0
          git add reports/

          # Defense in depth: ignored runtime cache must never enter the commit.
          staged_paths="$(git diff --cached --name-only)"
          if printf '%s\n' "$staged_paths" | grep -Fqx 'tf/0.4.0/.tf/' \
            || printf '%s\n' "$staged_paths" | grep -Fqx 'tf-provenance/0.4.0/.tf/' \
            || printf '%s\n' "$staged_paths" | grep -Eq '^tf/0\.4\.0/\.tf/' \
            || printf '%s\n' "$staged_paths" | grep -Eq '^tf-provenance/0\.4\.0/\.tf/'; then
            echo "Refusing to commit Text-Fabric runtime cache" >&2
            exit 1
          fi

          git commit -m "Build Text-Fabric 0.4.0 with sign language"
          git push origin HEAD:research/sign-lang-19
