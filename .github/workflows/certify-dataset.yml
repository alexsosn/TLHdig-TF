name: Certify shipped dataset

# Validate the committed TF artifact without rebuilding it. This complements dataset.yml:
# dataset.yml proves reproducibility from source; this workflow proves that the bytes
# actually present in the repository satisfy the full, versioned release policy.
# Certification intentionally refuses to publish evidence if the protected branch
# advances while the long gate suite is running; after final protected-tree changes,
# rerun it on a quiet head rather than rebasing stale certification output.
# Under release-v6 these paths are scheduling defense in depth only: stamp verification
# independently binds the broader protected Git-tree identity.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "tf/**/*.tf"
      - "tf-provenance/**/*.tf"
      - "corpus/**"
      - "app/**"
      - "programs/**"
      - "programs/tests/**"
      - "!programs/research_*.py"
      - "programs/research_weblink_ids.py"
      - "requirements.txt"
      - ".github/workflows/certify-dataset.yml"
      - ".github/workflows/build-final-*.yml"
      - ".github/workflows/build-final-*.yaml"
      - ".github/workflows/finalize-issue*.yml"
      - ".github/workflows/finalize-issue*.yaml"
      - ".github/workflows/materialize-*.yml"
      - ".github/workflows/materialize-*.yaml"
      - ".github/workflows/sync-*.yml"
      - ".github/workflows/sync-*.yaml"

# Only the newest certification for one ref can publish useful evidence. Keep the group
# stable across commits: adding github.sha here would recreate the obsolete-run race.
concurrency:
  group: certify-dataset-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate certification publication ref
        run: |
          CERT_BRANCH=$(PYTHONPATH=programs python -m tlhdig.certification_ref "$GITHUB_REF_TYPE" "$GITHUB_REF")
          echo "CERT_BRANCH=$CERT_BRANCH" >> "$GITHUB_ENV"
      - run: pip install -r requirements.txt
      - name: Full release certification of committed artifact
        run: python programs/release_check.py --mode regression-valid
      - name: Commit certification evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          TF_VERSION=$(PYTHONPATH=programs python -c 'from tlhdig import TF_VERSION; print(TF_VERSION)')
          git add -f "tf/${TF_VERSION}/BUILD-COMPLETE" "tf/${TF_VERSION}/RELEASE-CERTIFICATION.json"
          git add reports/
          if git diff --cached --quiet; then
            echo "Certification evidence already matches the committed artifact"
            exit 0
          fi
          git commit -m "Certify Text-Fabric ${TF_VERSION} release"
          git push origin "HEAD:refs/heads/${CERT_BRANCH}"
