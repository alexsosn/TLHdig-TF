name: Apply docid_raw implementation

on:
  push:
    branches: [feat/docid-raw]
    paths: [.github/workflows/apply-docid-raw.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/docid-raw
          fetch-depth: 0
      - name: Apply exact implementation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('programs/tlhdig/convert.py')
          text = path.read_text(encoding='utf8')
          old = '''    rel = source_path.src_file\n    docid = (root.findtext("AOHeader/docID") or Path(rel).stem).strip()\n'''
          new = '''    rel = source_path.src_file\n    raw_docid = root.findtext("AOHeader/docID")\n    docid = (raw_docid or Path(rel).stem).strip()\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '''        doc,\n        docid=docid, docid_raw=docid,\n        cth=source_path.cth,\n'''
          new = '''        doc,\n        docid=docid,\n        cth=source_path.cth,\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)

          old = '''    # XXXlang means unset; TF encodes absence by omitting the value (plan §5.3)\n    if lang and lang != "XXXlang":\n        cv.feature(doc, lang=lang)\n'''
          new = '''    # Preserve parsed source text before normalization or filename fallback.\n    # Missing and empty <docID> values are represented by feature absence; a\n    # whitespace-only value is non-empty and therefore intentionally preserved.\n    if raw_docid:\n        cv.feature(doc, docid_raw=raw_docid)\n\n    # XXXlang means unset; TF encodes absence by omitting the value (plan §5.3)\n    if lang and lang != "XXXlang":\n        cv.feature(doc, lang=lang)\n'''
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          path.write_text(text, encoding='utf8')

          path = Path('programs/tlhdig/featuremeta.py')
          text = path.read_text(encoding='utf8')
          old = '    "docid_raw": "same value as `docid` today: the converter strips both. Kept as a distinct feature so a future build can carry the unstripped element without a schema change.",\n'
          new = '    "docid_raw": "parsed text of source <docID> before whitespace normalization or filename fallback; omitted when the element is missing or empty. XML entity expansion and parser line-ending rules have already applied, so this is not byte-for-byte XML markup.",\n'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          path.write_text(text, encoding='utf8')
          PY
      - name: Commit implementation and remove helper
        run: |
          rm .github/workflows/apply-docid-raw.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add programs/tlhdig/convert.py programs/tlhdig/featuremeta.py
          git add -u .github/workflows/apply-docid-raw.yml
          git diff --cached --check
          git commit -m 'Preserve source text in docid_raw'
          git push origin HEAD:feat/docid-raw
