name: Diagnose unresolved manuscript contexts 18

on:
  push:
    paths:
      - ".github/workflows/green-witness-ownership-18.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joins-18
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Enumerate unresolved statements without join_context
        run: |
          PYTHONPATH=programs python - <<'PY'
          from collections import Counter
          from xml.parsers import expat
          from lxml import etree as ET
          from tlhdig import manuscripts, repair, source, sourcepath
          from tlhdig.paths import ENCRYPTED, PATCHES, corpus_files, rel

          patches = repair.read_manifest(PATCHES) if PATCHES.is_file() else {}
          counts = Counter()
          missing = []
          for path in corpus_files():
              src_file = rel(path)
              if src_file == ENCRYPTED:
                  continue
              parsed_path = sourcepath.parse(src_file)
              if not parsed_path.parse_ok or not parsed_path.project:
                  continue
              data = path.read_bytes()
              patch_entry = patches.get(src_file)
              if patch_entry:
                  data = repair.apply(data, patch_entry[1], expect_sha=patch_entry[0])
              try:
                  source.scan(data)
                  root = ET.fromstring(data)
              except (expat.ExpatError, ET.XMLSyntaxError, ValueError):
                  continue
              div1 = root.find("body/div1")
              text = div1.find("text") if div1 is not None else None
              if text is None:
                  continue
              document = manuscripts.parse_document(div1)
              for block in document.blocks:
                  apparatus = block.apparatus
                  for statement in apparatus.statements:
                      if statement.resolved:
                          continue
                      counts["unresolved"] += 1
                      if statement.left is None and statement.right is None:
                          counts["endpoint_free"] += 1
                      if statement.context:
                          counts["with_context"] += 1
                      else:
                          counts["without_context"] += 1
                          missing.append((
                              src_file,
                              block.order,
                              statement.order,
                              statement.kind,
                              statement.raw,
                              statement.left,
                              statement.right,
                              apparatus.residual_text,
                              ET.tostring(block.element, encoding="unicode"),
                          ))
          print("COUNTS", dict(counts))
          print("UNRESOLVED WITHOUT CONTEXT")
          for row in missing:
              print("---")
              print("file=", row[0])
              print("block/order=", row[1], row[2])
              print("kind/raw/endpoints=", row[3], repr(row[4]), row[5], row[6])
              print("residual_text=", row[7])
              print("xml=", row[8])
          PY
