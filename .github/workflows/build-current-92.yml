name: Build current artifact for #92

# Final reviewed-code rebuild trigger.

# Rerun after feature-doc cache regression fix.

# Final rebuild after frozen pre-build census and adversarial hardening.
concurrency:
  group: build-current-92
  cancel-in-progress: true

on:
  push:
    branches: [research/mrp-markers-92]
    paths:
      - ".github/workflows/build-current-92.yml"

permissions:
  contents: write

jobs:
  build-current:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Clean rebuild current artifact
        run: python programs/build.py

      - name: Validate unchanged current artifact
        run: python programs/validate_current.py

      - name: Regenerate feature reference
        run: python programs/build_feature_docs.py

      - name: Re-run unit and integration tests against rebuilt artifact
        run: python -m pytest programs/tests -q

      - name: Verify current build manifest
        run: python programs/check_build_manifest.py

      - name: Show generated delta
        run: git status --short

      - name: Commit rebuilt current artifact
        run: |
          git add tf/0.4.0 tf-provenance/0.4.0 docs/features reports
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh current TF artifact for #92"
          git push origin HEAD:research/mrp-markers-92
