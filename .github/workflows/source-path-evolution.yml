name: Source path evolution research

on:
  push:
    branches:
      - research/source-path-evolution
    paths:
      - programs/analyze_source_paths.py
      - .github/workflows/source-path-evolution.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download TLHdig Beta 0.2
        run: |
          set -euo pipefail
          mkdir -p /tmp/tlhdig-releases/0.2
          curl --fail --location --retry 3 \
            'https://zenodo.org/records/15459134/files/TLHdig_0.2.0-beta.zip?download=1' \
            -o /tmp/tlhdig-releases/TLHdig_0.2.0-beta.zip
          echo '93e71e2560f5e109c87713d5590cb059  /tmp/tlhdig-releases/TLHdig_0.2.0-beta.zip' | md5sum --check -
          unzip -q /tmp/tlhdig-releases/TLHdig_0.2.0-beta.zip -d /tmp/tlhdig-releases/0.2

      - name: Generate cross-release report
        run: |
          set -euo pipefail
          python programs/analyze_source_paths.py \
            'Beta 0.2=/tmp/tlhdig-releases/0.2' \
            'Beta 0.3=corpus/TLHdig-0.3' \
            > reports/source-path-evolution.md
          printf '%s\n' \
            '' \
            '## Release provenance' \
            '' \
            '- **Beta 0.2**: Zenodo record `15459134`, file `TLHdig_0.2.0-beta.zip`, MD5 `93e71e2560f5e109c87713d5590cb059`.' \
            '- **Beta 0.3**: repository corpus `corpus/TLHdig-0.3`, derived from Zenodo record `20328284`, file `TLHbasisONLINE25_1_ZENODO_Beta_03.zip`, MD5 `f9acbc8db3111cc7dd88d82f7819a912`.' \
            '- **Beta 0.1**: the TLHdig project documents the September 2023 online release, but no independently downloadable 0.1 XML snapshot was identified during this phase. It is therefore excluded from quantitative path-evolution claims.' \
            >> reports/source-path-evolution.md

      - name: Commit generated report
        run: |
          set -euo pipefail
          if git diff --quiet -- reports/source-path-evolution.md; then
            echo 'report unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/source-path-evolution.md
          git commit -m 'Generate source path evolution report'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
