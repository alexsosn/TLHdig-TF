name: Final issue-18 integration build

on:
  push:
    paths:
      - ".github/workflows/build-final-18.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joins-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt

      - name: Merge the exact current main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          echo "BRANCH_START=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "MAIN_START=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          git merge --no-edit origin/main

      - name: Wire independently reviewed manuscript release invariants and docs
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("programs/check_manuscript_joins.py")
          s = p.read_text()
          old = (
              "    validate_joined,\n"
              "    validate_ledger,\n"
              "    validate_witnesses,\n"
              ")\n"
          )
          new = (
              "    validate_joined,\n"
              "    validate_ledger,\n"
              "    validate_source_census,\n"
              "    validate_witness_source_ownership,\n"
              "    validate_witnesses,\n"
              ")\n"
          )
          if old not in s:
              raise SystemExit("checker import anchor missing")
          s = s.replace(old, new, 1)

          old = 'OPTIONAL_FEATURES = ("siglum_candidates", "siglum_raw_candidates")\n'
          new = old + (
              "\nEXPECTED_SOURCE_CENSUS = {\n"
              "    \"source_documents\": 23_884,\n"
              "    \"source_blocks\": 24_294,\n"
              "    \"source_fragments\": 28_015,\n"
              "    \"source_statements\": 3_603,\n"
              "    \"source_witness_rows\": 136_046,\n"
              "    \"source_unresolved_statements\": 30,\n"
              "    \"source_unresolved_contexts\": 22,\n"
              "}\n"
          )
          if old not in s:
              raise SystemExit("checker census constant anchor missing")
          s = s.replace(old, new, 1)

          old = (
              "                statements.append(\n"
              "                    StatementRow(\n"
              "                        block=block.order,\n"
              "                        order=statement.order,\n"
              "                        kind=statement.kind,\n"
              "                        encoding=statement.encoding,\n"
              "                        raw=statement.raw,\n"
              "                        resolved=statement.resolved,\n"
              "                        left=statement.left,\n"
              "                        right=statement.right,\n"
              "                        context=statement.context,\n"
              "                    )\n"
              "                )\n"
          )
          new = old + (
              "                if not statement.resolved:\n"
              "                    stats[\"source_unresolved_statements\"] += 1\n"
              "                    if statement.context:\n"
              "                        stats[\"source_unresolved_contexts\"] += 1\n"
          )
          if old not in s:
              raise SystemExit("checker statement census anchor missing")
          s = s.replace(old, new, 1)

          old = (
              "    problems.extend(validate_edge_types(edge_rows))\n"
              "    stats[\"graph_fragment_ownership_checked\"] = len(ownership)\n"
              "    stats[\"graph_manuscript_edges_type_checked\"] = len(edge_rows)\n"
          )
          new = (
              "    problems.extend(validate_edge_types(edge_rows))\n\n"
              "    # A graph-only line can have schema-valid witness edges yet sit outside every\n"
              "    # document-local traversal below. Require every global witness source to have\n"
              "    # exactly one document owner so such edges cannot escape this conservation gate.\n"
              "    witness_sources = set()\n"
              "    for edge_name in (\"witness\", \"witness_resolution\"):\n"
              "        feature = getattr(E, edge_name, None)\n"
              "        if feature is not None:\n"
              "            witness_sources.update(source for source, _targets in feature.items())\n"
              "    witness_ownership = [\n"
              "        (line, len(tuple(L.u(line, otype=\"document\"))))\n"
              "        for line in sorted(witness_sources)\n"
              "    ]\n"
              "    problems.extend(validate_witness_source_ownership(witness_ownership))\n\n"
              "    stats[\"graph_fragment_ownership_checked\"] = len(ownership)\n"
              "    stats[\"graph_manuscript_edges_type_checked\"] = len(edge_rows)\n"
              "    stats[\"graph_witness_sources_ownership_checked\"] = len(witness_ownership)\n"
          )
          if old not in s:
              raise SystemExit("checker global witness anchor missing")
          s = s.replace(old, new, 1)

          old = (
              "    expected, source_stats, source_problems = _source_documents()\n"
              "    api, graph_stats, graph_problems = _graph_documents(expected)\n"
              "    problems = [*source_problems, *graph_problems]\n"
              "    stats = source_stats + graph_stats\n"
          )
          new = (
              "    expected, source_stats, source_problems = _source_documents()\n"
              "    census_problems = validate_source_census(EXPECTED_SOURCE_CENSUS, source_stats)\n"
              "    api, graph_stats, graph_problems = _graph_documents(expected)\n"
              "    problems = [*source_problems, *census_problems, *graph_problems]\n"
              "    stats = source_stats + graph_stats\n"
          )
          if old not in s:
              raise SystemExit("checker main census anchor missing")
          s = s.replace(old, new, 1)

          old = '        f"| source join statements | {stats[\'source_statements\']:,} |",\n'
          new = old + (
              '        f"| unresolved source join statements | {stats[\'source_unresolved_statements\']:,} |",\n'
              '        f"| unresolved source contexts preserved | {stats[\'source_unresolved_contexts\']:,} |",\n'
          )
          if old not in s:
              raise SystemExit("checker report source anchor missing")
          s = s.replace(old, new, 1)
          old = '        f"| graph convenience `joined` edges | {stats[\'graph_joined_edges\']:,} |",\n'
          new = old + '        f"| global witness-source ownership checks | {stats[\'graph_witness_sources_ownership_checked\']:,} |",\n'
          if old not in s:
              raise SystemExit("checker report graph anchor missing")
          p.write_text(s.replace(old, new, 1))

          p = Path("docs/TF-CONVERSION-PLAN.md")
          s = p.read_text()
          old = "fragment      document      docgroup      edit          lex\n"
          new = "fragment      joinstmt      document      docgroup      edit          lex\n"
          if old not in s:
              raise SystemExit("conversion plan node list anchor missing")
          p.write_text(s.replace(old, new, 1))

          p = Path("README.md")
          s = p.read_text()
          old = "  `cluster`, `lex`, `fragment`, `note`, `edit` and `docgroup`;\n"
          new = "  `cluster`, `lex`, `fragment`, `joinstmt`, `note`, `edit` and `docgroup`;\n"
          if old not in s:
              raise SystemExit("README layer-list anchor missing")
          p.write_text(s.replace(old, new, 1))

          p = Path("docs/plan-manuscript-joins.md")
          s = p.read_text()
          old = "- every repaired/strict `Manuscripts` block under converted `body/div1` is enumerated;\n"
          new = old + (
              "- the strict production census is frozen independently so parser and emitter cannot drift together to the same wrong population;\n"
              "- every line sourcing `witness` / `witness_resolution` belongs to exactly one document, including graph-global sources outside expected document traversals;\n"
          )
          if old not in s:
              raise SystemExit("join plan conservation anchor missing")
          p.write_text(s.replace(old, new, 1))

          p = Path("docs/research-manuscript-joins.md")
          s = p.read_text()
          marker = "## 12. Frozen strict production release census"
          if marker not in s:
              s += (
                  "\n\n## 12. Frozen strict production release census\n\n"
                  "Independent production-scope scans freeze the release population at **23,884 documents**, "
                  "**24,294 manuscript blocks**, **28,015 fragment occurrences**, **3,603 join statements**, "
                  "and **136,046 witness rows**. Of the 3,603 statements, **30 are unresolved** and exactly "
                  "**22 endpoint-free status statements preserve non-empty `join_context`**. These counts are "
                  "release invariants rather than values derived only from the production parser, preventing a "
                  "parser and emitter regression from agreeing on the same wrong population.\n"
              )
          p.write_text(s)
          PY

      - name: Commit protected source integration before building
        run: |
          git add programs/check_manuscript_joins.py docs/TF-CONVERSION-PLAN.md README.md docs/plan-manuscript-joins.md docs/research-manuscript-joins.md
          git commit -m "Harden manuscript conservation on current main"
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Rebuild immutable 0.3.0 candidate from scratch
        run: |
          rm -rf tf/0.3.0 tf-provenance/0.3.0
          python programs/build.py

      - name: Full unit and adversarial suite
        run: PYTHONPATH=programs python -m pytest programs/tests -q

      - name: Independent manuscript parser and graph conservation
        run: |
          python programs/check_manuscripts_parser.py
          python programs/check_manuscript_joins.py

      - name: Census and app validation
        run: |
          python programs/census.py
          python programs/check_app.py

      - name: Historical artifact immutability and cache hygiene
        run: |
          git diff --exit-code origin/main -- tf/0.1.0 tf/0.2.0 tf-provenance/0.1.0 tf-provenance/0.2.0
          rm -rf tf/0.3.0/.tf tf-provenance/0.3.0/.tf
          test ! -d tf/0.3.0/.tf
          test ! -d tf-provenance/0.3.0/.tf
          test "$(grep -v '^@' tf/0.3.0/join_context.tf | grep -v '^$' | wc -l | tr -d ' ')" = "22"
          grep -F '| problems | 0 |' reports/manuscript-joins.md
          grep -F '| unresolved source contexts preserved | 22 |' reports/manuscript-joins.md

      - name: Commit audited artifact and reports
        run: |
          git add -A tf/0.3.0 tf-provenance/0.3.0 reports/
          git commit -m "Rebuild Text-Fabric 0.3.0 after final manuscript review"

      - name: Fail closed if source refs moved, then publish
        run: |
          git fetch origin main research/joins-18
          test "$(git rev-parse origin/main)" = "$MAIN_START"
          test "$(git rev-parse origin/research/joins-18)" = "$BRANCH_START"
          git push origin HEAD:research/joins-18
