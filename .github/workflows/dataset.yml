name: Dataset

# The full conversion takes ~20 minutes and needs the corpus, so it runs on demand
# rather than on every push. It exists so the published tf/ can be reproduced and its
# complete release gate re-run without a local checkout.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Build
        run: python programs/build.py
      - name: Full release certification
        run: python programs/release_check.py --mode regression-valid
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: reports/
