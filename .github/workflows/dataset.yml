name: Dataset

# Clean hosted rebuild of the one current pre-alpha artifact. It normally runs on
# demand/monthly. The temporary PR trigger below validates #120's destructive cleanup
# against a fresh current rebuild and must be removed before merge.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 4 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Build current artifact
        run: python programs/build.py
      - name: Validate current artifact
        run: python programs/validate_current.py
      - name: Show generated current build manifest
        run: cat tf/0.4.0/BUILD-MANIFEST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            tf/*/BUILD-MANIFEST.json
