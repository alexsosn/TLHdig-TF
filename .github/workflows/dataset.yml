name: Dataset

# Clean hosted rebuild of the one current pre-alpha artifact. Normally manual/monthly.
# TEMPORARY #118 bootstrap: PR validation skips rebuild so the emitted manifest binds
# exactly the generated bytes already committed on the branch. Remove after capture.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 4 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Build current artifact
        if: github.event_name != 'pull_request'
        run: python programs/build.py
      - name: Validate current artifact
        env:
          TLHDIG_CODE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python programs/validate_current.py
      - name: Show generated current build manifest
        run: cat tf/0.4.0/BUILD-MANIFEST.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            tf/*/BUILD-MANIFEST.json
