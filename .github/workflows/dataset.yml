name: Dataset

# Clean hosted rebuild of the one current pre-alpha artifact. It runs on demand/monthly
# because full conversion is expensive; it never commits generated evidence back to Git.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Build current artifact
        run: python programs/build.py
      - name: Validate current artifact
        run: python programs/validate_current.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            reports/
            tf/*/BUILD-MANIFEST.json
