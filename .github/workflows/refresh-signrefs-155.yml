# Disposable report-publication job; delete after the first successful run.
name: Refresh exact current sign-reference report
on:
  push:
    branches: [fix/mixed-damage-compound-21]
    paths:
      - .github/workflows/refresh-signrefs-155.yml
permissions:
  contents: write
concurrency:
  group: publish-signrefs-155
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Verify the already committed current TF artifact
        run: python programs/check_build_manifest.py
      - name: Verify alignment and regenerate its precise report
        run: python programs/check_alignment.py
      - name: Independently fetch pinned sign references
        run: python programs/fetch_signrefs.py --mode release
      - name: Validate full sign-reference agreement and regenerate its report
        run: python programs/check_signrefs.py --mode release
      - name: Commit only generated human-readable reports
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- reports/alignment.md reports/signrefs.md
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'docs(#21): refresh exact generated alignment and external sign-reference reports'
          git push origin HEAD:refs/heads/fix/mixed-damage-compound-21
