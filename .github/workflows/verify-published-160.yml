# One-time read-only remote E2E. Delete after the real consumer passes.
name: Verify published remote TLHdig consumer (#160)
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-published-160.yml]
permissions:
  contents: read
jobs:
  cold-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt 'text-fabric[github]==13.1.0' 'PyGithub<2.7'
      - name: Fresh-home Text-Fabric remote app + explicit feature load + verified corpus
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fresh_home=$(mktemp -d)
          fresh_cwd=$(mktemp -d)
          cd "$fresh_cwd"
          HOME="$fresh_home" PYTHONPATH="$GITHUB_WORKSPACE/programs" python - <<'PY'
          from pathlib import Path
          from tf.app import use
          from tf.fabric import Fabric
          import verify_dataset
          A=use('alexsosn/TLHdig-TF',silent='deep')
          assert A is not None and A.api is not None, 'remote app cannot load'
          remote=Path.home()/'text-fabric-data/github/alexsosn/TLHdig-TF/tf/0.4.0'
          assert remote.is_dir(), 'remote ZIP did not extract'
          ok,problems=verify_dataset.verify(remote)
          assert ok, ('release hash failure',problems[:10])
          # The web app does not preload src_file or inferred: explicitly load
          # those release features from the remotely downloaded TF directory.
          tf=Fabric(locations=str(remote),silent='deep')
          api=tf.load('otype oslots src_file inferred sym lnr',silent='deep')
          assert api not in (False,None), 'remote explicit feature load failed'
          F,L=api.F,api.L
          doc=[d for d in F.otype.s('document')
               if F.src_file.v(d)=='CTH 170_XML_TLH/KBo 31.40.xml']
          assert len(doc)==1,doc
          inferred=[w for w in L.d(doc[0],otype='word') if F.inferred.v(w)==1]
          assert len(inferred)==41,len(inferred)
          seen={F.sym.v(s) for s in L.d(doc[0],otype='sign')}
          expected={'URU','ŠEŠ','QÍ','BÍ','MA','DAM','MEŠ'}
          assert expected<=seen,(expected-seen)
          lines=[l for l in A.api.F.otype.s('line')[:2000]
                 if (A.api.T.text(l,fmt='text-orig-plain') or '').strip()]
          assert lines,'no readable browser/app text'
          print('REMOTE E2E SUCCESS: 141 main TF manifest files verified')
          print('Recovered source-backed words:',len(inferred))
          print('Verified source readings:',sorted(expected))
          print('Rendered sample:',repr(A.api.T.text(lines[0],fmt='text-orig-plain')[:120]))
          PY
