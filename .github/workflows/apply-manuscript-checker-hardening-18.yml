name: Apply manuscript checker hardening 18
on:
  push:
    branches: [research/joins-18]
    paths:
      - programs/apply_manuscript_checker_hardening.py
      - .github/workflows/apply-manuscript-checker-hardening-18.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Apply checker hardening
        run: python programs/apply_manuscript_checker_hardening.py
      - name: Ownership/type RED becomes GREEN
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_conservation.py programs/tests/test_manuscript_release_policy.py -q
      - name: Syntax check full corpus gate
        run: python -m py_compile programs/check_manuscript_joins.py
      - name: Commit production hardening and remove one-shot machinery
        run: |
          rm programs/apply_manuscript_checker_hardening.py .github/workflows/apply-manuscript-checker-hardening-18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/check_manuscript_joins.py programs/apply_manuscript_checker_hardening.py .github/workflows/apply-manuscript-checker-hardening-18.yml
          git commit -m 'Harden manuscript conservation gate globally'
          git push
