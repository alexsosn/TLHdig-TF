name: Apply release 0.3.0 for joins 18

on:
  push:
    branches: [research/joins-18]
    paths: [.github/workflows/apply-release-030-18.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joins-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Apply current-release pointer changes
        run: python programs/apply_release_030_18.py
      - name: Immutable release RED turns GREEN
        run: PYTHONPATH=programs python -m pytest programs/tests/test_release_version.py -q
      - name: Preserve join graph tests
        run: |
          PYTHONPATH=programs python -m pytest programs/tests/test_manuscripts.py -q
          PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_raw_provenance.py -q
          PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_graph.py -q
      - name: Diff sanity
        run: git diff --check
      - name: Commit release pointers and remove one-shot machinery
        run: |
          rm programs/apply_release_030_18.py .github/workflows/apply-release-030-18.yml
          git add programs/tlhdig/__init__.py app/config.yaml README.md KNOWN-ISSUES.md CITATION.cff docs/AGORA-INTEGRATION.md programs/apply_release_030_18.py .github/workflows/apply-release-030-18.yml
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'Allocate immutable TF 0.3.0 for manuscript joins'
          git push origin HEAD:research/joins-18
