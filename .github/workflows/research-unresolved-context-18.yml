name: Research unresolved manuscript context 18
on:
  push:
    branches: [research/joins-18]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joins-18
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python programs/research_manuscript_unresolved_context.py
