# Disposable one-shot release update, used only after #47's published-asset
# digest RED tests have passed. Remove immediately after run; no standing write CI.
name: Refresh current pre-alpha TF download asset 47
on:
  push:
    branches: [fix/distribution-bare-acquisition-47]
    paths: [.github/workflows/refresh-current-release-47.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned build dependencies
        run: pip install -r requirements.txt
      - name: Test clean acquisition and uploaded asset digest behavior
        run: python -m pytest programs/tests/test_distribution_acquisition.py programs/tests/test_install_contract.py -q
      - name: Verify source and current artifact identities
        run: |
          python programs/check_build_manifest.py
          git fetch --quiet origin main
          git diff --exit-code origin/main -- tf/0.4.0
      - name: Re-publish single latest mutable pre-alpha release from upstream main
        run: python programs/publish_release.py --publish --target origin/main
      - name: Verify public latest release resolves current artifact
        run: python programs/check_distribution.py --mode release
