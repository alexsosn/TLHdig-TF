name: Research pre-line words 52

on:
  push:
    paths:
      - "programs/research_preline_words_52.py"
      - "programs/research_preline_section_model_52.py"
      - ".github/workflows/research-preline-52.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Inventory every pre-line word and reconcile the TF deficit
        run: python programs/research_preline_words_52.py
      - name: Verify document-only slots need no fabricated line address
        run: python programs/research_preline_section_model_52.py
