name: Apply join schema cleanup 18

on:
  push:
    branches: [research/joins-18]
    paths:
      - programs/apply_join_schema_cleanup_18.py
      - .github/workflows/apply-join-schema-cleanup-18.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            programs
            README.md
            KNOWN-ISSUES.md
            requirements.txt
            .github/workflows/apply-join-schema-cleanup-18.yml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Apply assertion-heavy migration cleanup
        run: python programs/apply_join_schema_cleanup_18.py
      - name: Targeted converter migration GREEN
        run: >-
          PYTHONPATH=programs python -m pytest
          programs/tests/test_convert.py
          programs/tests/test_manuscript_graph.py
          programs/tests/test_manuscript_multiblock_graph.py
          programs/tests/test_manuscript_conservation.py
          programs/tests/test_manuscript_release_policy.py -q
      - name: Commit production cleanup and remove one-shot machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm programs/apply_join_schema_cleanup_18.py
          rm .github/workflows/apply-join-schema-cleanup-18.yml
          git add README.md KNOWN-ISSUES.md programs/tests/test_convert.py \
            programs/apply_join_schema_cleanup_18.py \
            .github/workflows/apply-join-schema-cleanup-18.yml
          git commit -m "Align tests and docs with manuscript graph schema"
          git push origin HEAD:research/joins-18
