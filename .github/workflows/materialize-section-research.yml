name: Materialize section-addressing research census

on:
  push:
    branches: [research/section-addressing-15]
    paths: [.github/workflows/materialize-section-research.yml]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/section-addressing-15
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Generate exhaustive census
        run: |
          mkdir -p reports
          python programs/research_section_addressing.py > reports/section-addressing-research.json
          python -m json.tool reports/section-addressing-research.json >/dev/null
      - name: Commit report and remove this materializer
        run: |
          rm .github/workflows/materialize-section-research.yml
          git add reports/section-addressing-research.json .github/workflows/materialize-section-research.yml
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'research: record exhaustive section-addressing census'
          git push origin HEAD:research/section-addressing-15
