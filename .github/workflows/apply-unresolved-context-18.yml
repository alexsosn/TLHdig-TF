name: Apply unresolved manuscript context 18
on:
  push:
    branches: [research/joins-18]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joins-18
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Implement planned unresolved context model
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, *, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              s = s.replace(old, new, count)
              p.write_text(s)

          # Pure parser: context belongs to the source separator/statement, not an invented entry.
          patch('programs/tlhdig/manuscripts.py',
              '    right: int | None\n    resolved: bool\n\n\n@dataclass(frozen=True)\nclass Apparatus:',
              '    right: int | None\n    resolved: bool\n    context: str = ""\n\n\n@dataclass(frozen=True)\nclass Apparatus:')
          patch('programs/tlhdig/manuscripts.py',
              'class _Separator:\n    kind: str\n    encoding: str\n    raw: str\n',
              'class _Separator:\n    kind: str\n    encoding: str\n    raw: str\n    context: str = ""\n')
          patch('programs/tlhdig/manuscripts.py',
              '            marker = _normalise(status.group("marker"))\n            tokens.append(_Separator(_marker_kind(marker), "textual", marker))',
              '            marker = _normalise(status.group("marker"))\n            tokens.append(_Separator(_marker_kind(marker), "textual", marker, context=label))')
          patch('programs/tlhdig/manuscripts.py',
              '                right=right.order if right is not None else None,\n                resolved=resolved,\n            )',
              '                right=right.order if right is not None else None,\n                resolved=resolved,\n                context=token.context,\n            )')

          # Graph: preserve optional source reference on authoritative statement node only.
          patch('programs/tlhdig/manuscript_graph.py',
              '            if not values["join_resolved"]:\n                reason = _statement_reason(statement)',
              '            if statement.context:\n                values["join_context"] = statement.context\n            if not values["join_resolved"]:\n                reason = _statement_reason(statement)')

          # Independent ledger rows compare the context as source evidence.
          patch('programs/tlhdig/manuscript_conservation.py',
              '    right: int | None\n\n\ndef feature_load_spec(',
              '    right: int | None\n    context: str = ""\n\n\ndef feature_load_spec(')

          # Corpus checker: require and compare the new production feature.
          patch('programs/check_manuscript_joins.py',
              '    "join_order join_kind join_encoding join_raw join_resolved "',
              '    "join_order join_kind join_encoding join_raw join_resolved join_context "')
          patch('programs/check_manuscript_joins.py',
              '                        right=statement.right,\n                    )',
              '                        right=statement.right,\n                        context=statement.context,\n                    )')
          patch('programs/check_manuscript_joins.py',
              '                    right=right,\n                )',
              '                    right=right,\n                    context=str(_value(F.join_context, node, "") or ""),\n                )')

          # Feature metadata and app discoverability.
          patch('programs/tlhdig/featuremeta.py',
              '    "join_raw": "literal source join operator or textual marker",\n',
              '    "join_raw": "literal source join operator or textual marker",\n    "join_context": "unresolved manuscript reference/context preserved when the source statement has no recoverable fragment endpoint; never an inferred endpoint",\n')
          patch('app/config.yaml',
              '    features: join_encoding join_resolved manuscript_block\n',
              '    features: join_encoding join_resolved join_context manuscript_block\n')
          PY
      - name: New RED becomes GREEN
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_unresolved_context.py -q
      - name: Manuscript parser and graph regression suite
        run: |
          PYTHONPATH=programs python -m pytest \
            programs/tests/test_manuscripts.py \
            programs/tests/test_manuscript_graph.py \
            programs/tests/test_manuscript_multiblock_graph.py \
            programs/tests/test_manuscript_conservation.py -q
      - name: Full unit suite
        run: PYTHONPATH=programs python -m pytest programs/tests -q
      - name: Recovery parser corpus conservation unchanged
        run: python programs/check_manuscripts_parser.py
      - name: Commit implementation and remove harness
        run: |
          rm .github/workflows/apply-unresolved-context-18.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programs/tlhdig/manuscripts.py programs/tlhdig/manuscript_graph.py programs/tlhdig/manuscript_conservation.py programs/check_manuscript_joins.py programs/tlhdig/featuremeta.py app/config.yaml .github/workflows/apply-unresolved-context-18.yml
          git commit -m 'Preserve unresolved manuscript source references'
          git push origin HEAD:research/joins-18
