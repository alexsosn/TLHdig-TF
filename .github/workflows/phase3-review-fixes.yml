name: Apply Phase 3 review fixes

on:
  push:
    branches: [feat/project-metadata]
    paths: ['.github/workflows/phase3-review-fixes.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-metadata
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact reviewed replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('programs/tlhdig/convert.py')
          text = path.read_text(encoding='utf8')
          old = '''        if not parsed_path.parse_ok:\n            raise ValueError(\n                f"invalid source path {rel!r}: {parsed_path.parse_error}"\n            )\n        data = path.read_bytes()\n'''
          new = '''        if not parsed_path.parse_ok:\n            raise ValueError(\n                f"invalid source path {rel!r}: {parsed_path.parse_error}"\n            )\n        if not parsed_path.project:\n            raise ValueError(f"invalid source path {rel!r}: missing_project")\n        data = path.read_bytes()\n'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new), encoding='utf8')

          path = Path('programs/build.py')
          text = path.read_text(encoding='utf8')
          old = '        "    Fabric(locations=[\'tf/0.1.0\', \'tf-provenance/0.1.0\'])\\n\\n"\n'
          new = '        f"    Fabric(locations=[\'tf/{TF_VERSION}\', \'tf-provenance/{TF_VERSION}\'])\\n\\n"\n'
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new), encoding='utf8')
          PY
      - name: Commit fixes and remove helper workflow
        run: |
          rm .github/workflows/phase3-review-fixes.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add programs/tlhdig/convert.py programs/build.py
          git add -u .github/workflows/phase3-review-fixes.yml
          git diff --cached --check
          git commit -m 'Fix Phase 3 independent review findings'
          git push origin HEAD:feat/project-metadata
