name: Apply sign language release integration 19

on:
  push:
    paths:
      - ".github/workflows/apply-sign-language-integration-19.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sign-lang-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Merge current main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
      - name: Reconfirm semantic GREEN on merged base
        run: python -m pytest programs/tests/test_sign_language.py -q
      - name: Reconfirm integration RED on merged base
        run: |
          set +e
          python -m pytest programs/tests/test_sign_language_release_integration.py -q > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          test "$rc" -ne 0
          grep -q "4 failed" /tmp/red.log
      - name: Apply release-v4 integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf8")
              assert old in text, f"missing pattern in {path}: {old!r}"
              p.write_text(text.replace(old, new, 1), encoding="utf8")

          edit(
              "programs/tlhdig/__init__.py",
              'TF_VERSION = "0.3.0"',
              'TF_VERSION = "0.4.0"',
          )
          edit(
              "programs/tlhdig/release_policy.py",
              'POLICY = "release-v3"',
              'POLICY = "release-v4"',
          )
          edit(
              "programs/tlhdig/release_policy.py",
              '    "structure",\n    "manuscript-joins",',
              '    "structure",\n    "sign-language",\n    "manuscript-joins",',
          )
          edit(
              "programs/release_check.py",
              '    certification.Gate("structure", ("python", "programs/check_structure.py")),\n    certification.Gate("manuscript-joins",',
              '    certification.Gate("structure", ("python", "programs/check_structure.py")),\n    certification.Gate("sign-language", ("python", "programs/check_sign_language.py")),\n    certification.Gate("manuscript-joins",',
          )
          edit(
              "programs/tlhdig/featuremeta.py",
              '    "lang": "language; omitted entirely when the source says XXXlang (= unset)",',
              '    "lang": "source-declared language. On sign slots this is the effective value chosen by word > active colon > current line > text precedence; empty and XXXlang are unset, raw nonempty labels are preserved. On coarser nodes it retains their source language value.",',
          )
          edit(
              "app/config.yaml",
              '  version: "0.3.0"',
              '  version: "0.4.0"',
          )
          edit(
              "app/config.yaml",
              '    features: type corr subscr materlect',
              '    features: type lang corr subscr materlect',
          )
          PY
      - name: Integration GREEN
        run: python -m pytest programs/tests/test_sign_language_release_integration.py programs/tests/test_sign_language.py programs/tests/test_appcheck.py programs/tests/test_certification.py -q
      - name: Policy self-consistency
        run: PYTHONPATH=programs python -c 'import release_check; assert release_check.policy_problem() is None'
      - name: Commit merged base and release integration
        run: |
          rm .github/workflows/apply-sign-language-integration-19.yml
          git add programs/tlhdig/__init__.py programs/tlhdig/release_policy.py programs/release_check.py programs/tlhdig/featuremeta.py app/config.yaml .github/workflows/apply-sign-language-integration-19.yml
          git commit -m "Wire sign language into Text-Fabric 0.4 release"
          git push origin HEAD:research/sign-lang-19
