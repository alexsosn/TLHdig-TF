name: Measure historical TF trees

on:
  pull_request:

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Measure predecessor generated trees
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path("tf/0.1.0"),
              Path("tf/0.2.0"),
              Path("tf/0.3.0"),
              Path("tf-provenance/0.1.0"),
              Path("tf-provenance/0.2.0"),
              Path("tf-provenance/0.3.0"),
          ]
          total_files = 0
          total_bytes = 0
          for target in targets:
              files = [path for path in target.rglob("*") if path.is_file()]
              size = sum(path.stat().st_size for path in files)
              total_files += len(files)
              total_bytes += size
              print(f"{target}: files={len(files)} bytes={size}")
          print(f"PRUNE_TOTAL_FILES={total_files}")
          print(f"PRUNE_TOTAL_BYTES={total_bytes}")
          PY
