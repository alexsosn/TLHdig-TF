# Disposable one-shot integration lane for reviewed #21 candidate. Delete after use.
name: Integrate reviewed mixed alignment candidate 21
on:
  push:
    branches: [fix/mixed-damage-compound-21]
    paths: [.github/workflows/integrate-alignment-21.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Adversarial RED regressions
        run: python -m pytest programs/tests/test_mixed_damage_compound.py programs/tests/test_research_alignment_delta.py -q
      - name: Snapshot independently protected old artifact
        run: |
          mkdir -p /tmp/tlhdig-before
          cp tf/0.4.0/cu_sign.tf tf/0.4.0/cu_nsigns.tf tf/0.4.0/cu_aligned.tf tf/0.4.0/cu_method.tf /tmp/tlhdig-before/
          python - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0, "programs")
          from tlhdig import TF_VERSION, PROVENANCE_DIR, build_manifest
          from tlhdig.paths import ROOT
          before = build_manifest.output_identity(
              ROOT / "tf" / TF_VERSION, ROOT / PROVENANCE_DIR / TF_VERSION
          )
          Path("/tmp/tlhdig-before.json").write_text(json.dumps(before,sort_keys=True),encoding="utf8")
          print("snapshotted",len(before["files"]),"output files")
          PY
      - name: Rebuild one current artifact from pinned input
        run: python programs/build.py
      - name: Acquire and verify all independent sign lists
        run: python programs/fetch_signrefs.py --mode release
      - name: Reject protected output drift and report every changed glyph
        run: |
          python programs/research_alignment_delta.py --before /tmp/tlhdig-before \
            --baseline /tmp/tlhdig-before.json --after tf/0.4.0
      - name: Adversarial spot checks of adverse changes
        run: |
          python - <<'PY'
          import gzip,json
          p="reports/research-alignment-delta-21.jsonl.gz"
          rules={
              "new all-reference disagreement":lambda x:x["old"] is None and x["newReference"]=="all-disagree",
              "withdrawn earlier supported":lambda x:x["new"] is None and x["oldReference"]=="supported",
              "previously all-disagreed removed":lambda x:x["new"] is None and x["oldReference"]=="all-disagree",
          }
          seen={k:0 for k in rules}
          with gzip.open(p,"rt",encoding="utf8") as fp:
              for raw in fp:
                  x=json.loads(raw)
                  for label,test in rules.items():
                      if seen[label]<8 and test(x):
                          print(label,json.dumps({key:x.get(key) for key in
                              ["signNode","lineNode","txtid","lnr","reading","old","new","oldReference","newReference"]},
                              ensure_ascii=False))
                          seen[label]+=1
          print("sample sizes",seen)
          PY
      - name: Mandatory sign alignment and full corpus validation
        run: |
          python programs/check_alignment.py
          python programs/check_signrefs.py --mode release
          python programs/validate_current.py
      - name: Commit only audited current alignment outputs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tf/0.4.0/cu_sign.tf tf/0.4.0/cu_nsigns.tf \
            tf/0.4.0/cu_aligned.tf tf/0.4.0/cu_method.tf \
            tf/0.4.0/cu_undecided.tf tf/0.4.0/cu_unrendered.tf \
            tf/0.4.0/BUILD-MANIFEST.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'Nothing to integrate (unexpected for measured 17,023 additions)'
            exit 1
          fi
          git commit -m 'Rebuild single current TF alignment artifact after reviewed #21 candidate'
          git push origin HEAD:refs/heads/fix/mixed-damage-compound-21
      - name: Upload complete case-level review report even if a gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alignment-integrated-review-21
          path: |
            reports/
            tf/0.4.0/BUILD-MANIFEST.json
          if-no-files-found: warn
