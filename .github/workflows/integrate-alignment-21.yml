# Disposable write-enabled one-shot lane. Delete immediately after integration.
name: Integrate audited current alignment 21
on:
  push:
    branches: [fix/mixed-damage-compound-21]
    paths: [.github/workflows/integrate-alignment-21.yml]
permissions:
  contents: write
concurrency:
  group: current-alignment-artifact-21
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: RED cases including original source ellipsis and compound ambiguities
        run: python -m pytest programs/tests/test_mixed_damage_compound.py programs/tests/test_research_alignment_delta.py -q
      - name: Snapshot source and protected feature identities
        run: |
          mkdir -p /tmp/tlhdig-before
          cp tf/0.4.0/cu_sign.tf tf/0.4.0/cu_nsigns.tf tf/0.4.0/cu_aligned.tf tf/0.4.0/cu_method.tf /tmp/tlhdig-before/
          python - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0, "programs")
          from tlhdig import TF_VERSION, PROVENANCE_DIR, build_manifest
          from tlhdig.paths import ROOT
          identity = build_manifest.output_identity(
              ROOT / "tf" / TF_VERSION, ROOT / PROVENANCE_DIR / TF_VERSION
          )
          Path("/tmp/tlhdig-before.json").write_text(json.dumps(identity,sort_keys=True),encoding="utf8")
          print("baseline",len(identity["files"]),"outputs")
          PY
      - name: Rebuild only current pinned TLHdig TF artifact
        run: python programs/build.py
      - name: Fetch all external witnesses at locked revisions
        run: python programs/fetch_signrefs.py --mode release
      - name: Independently compare every changed sign and protected output
        run: |
          python programs/research_alignment_delta.py --before /tmp/tlhdig-before \
            --baseline /tmp/tlhdig-before.json --after tf/0.4.0
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path("reports/research-alignment-delta-21.json").read_text())
          assert not data["protectedFeatureDifferences"], data["protectedFeatureDifferences"]
          assert data["newLegibleEllipsisAssignments"] == 0, data["newLegibleEllipsisAssignments"]
          assert data["comparison"]["replaced"] > 0, "repaired source shifts must actually be produced"
          print("INDIVIDUAL SIGN DELTA", json.dumps(data["comparison"],sort_keys=True))
          PY
      - name: Mandatory independent alignment and all current validation gates
        run: |
          python programs/check_alignment.py
          python programs/check_signrefs.py --mode release
          python programs/validate_current.py
      - name: Stage exactly documented mutable alignment outputs and matching manifest
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # tf/ is deliberately ignored to prevent accidental half-built corpus commits.
          # Match programs/publish_dataset.sh: stage only fully validated files with -f.
          git add -f -- tf/0.4.0/cu_sign.tf tf/0.4.0/cu_nsigns.tf \
            tf/0.4.0/cu_aligned.tf tf/0.4.0/cu_method.tf \
            tf/0.4.0/cu_undecided.tf tf/0.4.0/cu_unrendered.tf \
            tf/0.4.0/BUILD-MANIFEST.json
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'refusing empty artifact update after observed corpus delta'
            exit 1
          fi
          git commit -m 'Regenerate current TF alignment with verified compound/lacuna safety (#21 #157)'
          git push origin HEAD:refs/heads/fix/mixed-damage-compound-21
      - name: Upload independently measured before-after cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-current-alignment-21
          path: |
            reports/research-alignment-delta-21.json
            reports/research-alignment-delta-21.jsonl.gz
            tf/0.4.0/BUILD-MANIFEST.json
          if-no-files-found: warn
