name: Join research 18

on:
  push:
    branches: [research/joins-18]

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Manuscript apparatus parser contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscripts.py -q
      - name: Raw siglum provenance contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_raw_provenance.py -q
      - name: Manuscript graph contract
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_graph.py -q
      - name: Manuscript parser corpus conservation
        run: python programs/check_manuscripts_parser.py
      - name: Production apparatus reachability
        run: python programs/research_manuscript_reachability.py
      - name: Measure manuscript join grammar
        run: python programs/research_joins.py
      - name: Measure mixed-content manuscript entries
        run: python programs/research_joins_mixed.py
      - name: Measure textual join notation
        run: python programs/research_joins_textual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: joins-research-18
          path: |
            reports/joins-research.md
            reports/joins-research.json
            reports/joins-mixed-research.md
            reports/joins-mixed-research.json
            reports/joins-textual-research.md
            reports/joins-textual-research.json
