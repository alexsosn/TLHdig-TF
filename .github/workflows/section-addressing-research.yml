name: Section-addressing research

on:
  pull_request:
    paths:
      - 'programs/research_section_addressing.py'
      - '.github/workflows/section-addressing-research.yml'

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install converter dependencies
        run: pip install -r requirements.txt
      - name: Inventory all repaired-source lb elements without usable lnr
        run: python programs/research_section_addressing.py
