name: Phase 3 one-shot implementation

on:
  push:
    branches:
      - feat/project-metadata

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-metadata

      - name: Apply exact planned replacements
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          path = Path("programs/tlhdig/convert.py")
          text = path.read_text(encoding="utf8")

          text = replace_once(
              text,
              "from . import cuneiform, lineref, morph, repair, signs, source\n",
              "from . import cuneiform, lineref, morph, repair, signs, source, sourcepath\n",
              "sourcepath import",
          )
          text = replace_once(
              text,
              '\n_CTH_DIR = re.compile(r"^CTH ([^_]+)_XML_(.+)$")\n_AO =',
              '\n_AO =',
              "duplicate CTH regex removal",
          )
          text = replace_once(
              text,
              '        if rel == ENCRYPTED:\n            ledger.exclude(rel, "encrypted")\n            continue\n        data = path.read_bytes()\n',
              '        if rel == ENCRYPTED:\n            ledger.exclude(rel, "encrypted")\n            continue\n        parsed_path = sourcepath.parse(rel)\n        if not parsed_path.parse_ok:\n            raise ValueError(\n                f"invalid source path {rel!r}: {parsed_path.parse_error}"\n            )\n        data = path.read_bytes()\n',
              "director path validation",
          )
          text = replace_once(
              text,
              '        made = _document(cv, root, spans, data, rel, keep_empty, omap, groups, ledger,\n                         lexemes)\n',
              '        made = _document(\n            cv, root, spans, data, parsed_path, keep_empty, omap, groups, ledger,\n            lexemes,\n        )\n',
              "document call",
          )
          text = replace_once(
              text,
              'def _document(cv, root, spans, data, rel, keep_empty, omap=None, groups=None,\n              ledger=None, lexemes=None):\n    parts = rel.split("/")\n    m = _CTH_DIR.match(parts[0])\n    cth, subcorpus = (m.group(1), m.group(2)) if m else ("", "")\n\n    docid = (root.findtext("AOHeader/docID") or Path(rel).stem).strip()\n',
              'def _document(cv, root, spans, data, source_path, keep_empty, omap=None, groups=None,\n              ledger=None, lexemes=None):\n    rel = source_path.src_file\n    docid = (root.findtext("AOHeader/docID") or Path(rel).stem).strip()\n',
              "document path boundary",
          )
          text = replace_once(
              text,
              '    cv.feature(\n        doc,\n        docid=docid, docid_raw=docid, cth=cth, subcorpus=subcorpus,\n        src_file=rel, lang_raw=lang,\n    )\n',
              '    cv.feature(\n        doc,\n        docid=docid, docid_raw=docid,\n        cth=source_path.cth,\n        project=source_path.project, subcorpus=source_path.project,\n        src_file=source_path.src_file, source_subdir=source_path.source_subdir,\n        source_stem=source_path.source_stem, lang_raw=lang,\n    )\n',
              "document metadata",
          )
          path.write_text(text, encoding="utf8")

          path = Path("programs/tlhdig/featuremeta.py")
          text = path.read_text(encoding="utf8")
          text = replace_once(
              text,
              '    "cth": "CTH catalogue number, from the containing directory",\n    "subcorpus": "HPM sub-project, from the containing directory (TLH, HFR, ...)",\n    "src_file": "path of the source XML relative to the corpus root",\n',
              '    "cth": "CTH catalogue number parsed from the top-level source directory",\n    "project": "HPM editorial project code parsed from the top-level _XML_<project> source directory",\n    "subcorpus": "compatibility alias for `project`; retained for existing queries and app configuration",\n    "src_file": "normalised source XML path relative to the corpus root; release-scoped record identity/provenance, not a cross-release persistent identifier",\n    "source_subdir": "intermediate source-path components between the top-level CTH/project directory and XML filename; provenance only, not project classification",\n    "source_stem": "source XML filename without .xml; convenient path decomposition, not a persistent identifier",\n',
              "feature metadata",
          )
          path.write_text(text, encoding="utf8")
          PY

      - name: Remove one-shot workflow and commit implementation
        run: |
          set -euo pipefail
          rm .github/workflows/phase3-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programs/tlhdig/convert.py programs/tlhdig/featuremeta.py .github/workflows/phase3-apply.yml
          git commit -m 'Implement source project metadata from parsed paths'
          git push origin HEAD:feat/project-metadata
