name: Apply manuscript plan status 18
on:
  push:
    branches: [research/joins-18]
    paths:
      - programs/apply_join_plan_status_18.py
      - .github/workflows/apply-join-plan-status-18.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply plan status cleanup
        run: python programs/apply_join_plan_status_18.py
      - name: Assert current manuscript schema is documented
        run: |
          grep -F 'tfVersion     = 0.3.0' docs/TF-CONVERSION-PLAN.md
          grep -F 'check_manuscript_joins.py' docs/TF-CONVERSION-PLAN.md
          grep -F 'ADR-0001' docs/TF-CONVERSION-PLAN.md
          ! grep -F 'flattened to `document.directjoin` / `indirectjoin` strings' docs/TF-CONVERSION-PLAN.md
      - name: Commit docs and remove one-shot machinery
        run: |
          rm programs/apply_join_plan_status_18.py .github/workflows/apply-join-plan-status-18.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/TF-CONVERSION-PLAN.md programs/apply_join_plan_status_18.py .github/workflows/apply-join-plan-status-18.yml
          git commit -m 'Align conversion plan with manuscript graph release'
          git push
