name: Apply issue 19 integration GREEN

on:
  push:
    paths:
      - ".github/workflows/apply-integration-green-19.yml"

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sign-lang-19
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Reconcile current and historical release contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {found}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf8")

          replace(
              "programs/tests/test_sign_language_release_integration.py",
              '''def test_issue19_has_a_versioned_release_gate():\n    assert release_policy.POLICY == "release-v4"\n    assert "sign-language" in release_policy.REQUIRED_GATES\n    configured = {gate.name: gate.command for gate in release_check.GATES}\n    assert configured["sign-language"] == ("python", "programs/check_sign_language.py")\n    assert tuple(configured) == release_policy.REQUIRED_GATES\n''',
              '''def test_issue19_has_a_versioned_release_gate():\n    assert release_policy.POLICY == "release-v5"\n    assert "sign-language" in release_policy.REQUIRED_GATES\n    assert "predecessor-delta" in release_policy.REQUIRED_GATES\n    assert "releaseDelta" in release_policy.REQUIRED_INPUTS\n    configured = {gate.name: gate.command for gate in release_check.GATES}\n    assert configured["sign-language"] == ("python", "programs/check_sign_language.py")\n    assert tuple(configured) == release_policy.REQUIRED_GATES\n\n    historical_v4 = release_policy.policy_contract("release-v4")\n    assert historical_v4 is not None\n    assert "predecessor-delta" in historical_v4.required_gates\n    assert "releaseDelta" in historical_v4.required_inputs\n    assert "sign-language" not in historical_v4.required_gates\n\n    current_v5 = release_policy.policy_contract("release-v5")\n    assert current_v5 is not None\n    assert "sign-language" in current_v5.required_gates\n    assert "predecessor-delta" in current_v5.required_gates\n''',
          )

          replace(
              "programs/tests/test_release_version.py",
              '    assert "release-v4" in release and "sign-language" in release\n',
              '    assert "release-v5" in release and "sign-language" in release\n',
          )

          replace(
              "programs/tests/test_manuscript_release_policy.py",
              'def test_manuscript_conservation_remains_required_by_release_v4():\n    assert release_check.release_policy.POLICY == "release-v4"',
              'def test_manuscript_conservation_remains_required_by_current_release():\n    assert release_check.release_policy.POLICY == "release-v5"',
          )

          replace(
              "programs/tests/test_release_delta.py",
              '''def test_policy_v4_requires_predecessor_gate_and_release_delta_input():\n    assert release_policy.POLICY == "release-v4"\n    assert "predecessor-delta" in release_policy.REQUIRED_GATES\n    assert release_policy.REQUIRED_GATES[-1] == "code-tree-stable"\n    assert "releaseDelta" in release_policy.REQUIRED_INPUTS\n    assert release_policy.DELTA_BASELINE_TF_VERSION == "0.3.0"\n''',
              '''def test_current_policy_retains_predecessor_contract_and_historical_v4():\n    assert release_policy.POLICY == "release-v5"\n    assert "predecessor-delta" in release_policy.REQUIRED_GATES\n    assert "sign-language" in release_policy.REQUIRED_GATES\n    assert release_policy.REQUIRED_GATES[-1] == "code-tree-stable"\n    assert "releaseDelta" in release_policy.REQUIRED_INPUTS\n    assert release_policy.DELTA_BASELINE_TF_VERSION == "0.3.0"\n\n    historical_v4 = release_policy.policy_contract("release-v4")\n    assert historical_v4 is not None\n    assert "predecessor-delta" in historical_v4.required_gates\n    assert "releaseDelta" in historical_v4.required_inputs\n    assert "sign-language" not in historical_v4.required_gates\n''',
          )

          replace(
              "programs/tests/test_release_delta_adversarial.py",
              '''def test_committed_adoption_declaration_matches_shipped_artifact():\n    evidence = release_delta.check(\n        PROGRAMS / "release-delta.json",\n        root=ROOT,\n        current_version=TF_VERSION,\n    )\n    assert evidence == {\n        "baseline": True,\n        "tfVersion": release_policy.DELTA_BASELINE_TF_VERSION,\n        "baselineDigest": release_policy.DELTA_BASELINE_DIGEST,\n        "expectedChanges": [],\n        "actualChanges": [],\n    }\n''',
              '''def test_committed_release_declaration_matches_shipped_artifact():\n    if not (ROOT / "tf" / TF_VERSION).is_dir():\n        pytest.skip("current TF release is not materialized yet")\n    evidence = release_delta.check(\n        PROGRAMS / "release-delta.json",\n        root=ROOT,\n        current_version=TF_VERSION,\n    )\n    assert evidence == {\n        "baseline": False,\n        "tfVersion": "0.4.0",\n        "predecessorVersion": "0.3.0",\n        "predecessorDigest": release_policy.DELTA_BASELINE_DIGEST,\n        "expectedChanges": ["main:lang.tf"],\n        "actualChanges": ["main:lang.tf"],\n    }\n''',
          )

          # Current release prose: v4 remains the historical predecessor-aware policy;
          # v5 is the combined current policy with sign-language conservation.
          replace(
              "docs/RELEASE.md",
              "`release_check.py` runs the required source, repair, round-trip, morphology, structure,\nmanuscript-apparatus conservation, Contract A, marker, tag, provenance, alignment,\nexternal sign-reference, app, census, predecessor-delta and final code-tree-stability\ngates against one unchanged TF artifact.",
              "`release_check.py` runs the required source, repair, round-trip, morphology, structure,\nsign-language conservation, manuscript-apparatus conservation, Contract A, marker, tag,\nprovenance, alignment, external sign-reference, app, census, predecessor-delta and final\ncode-tree-stability gates against one unchanged TF artifact.",
          )
          replace(
              "docs/RELEASE.md",
              "The current full-release profile is versioned as **`release-v4`** in\n`programs/tlhdig/release_policy.py`.",
              "The current full-release profile is versioned as **`release-v5`** in\n`programs/tlhdig/release_policy.py`.",
          )
          replace(
              "docs/RELEASE.md",
              "Release-v4 also binds the intended change from the previous certified artifact.",
              "Release-v4 introduced predecessor binding, and release-v5 retains that contract while\nadding mandatory sign-language conservation. The release declaration still binds the\nintended change from the previous certified artifact.",
          )
          replace(
              "docs/RELEASE.md",
              "release-v2 and retained by release-v3 and release-v4:",
              "release-v2 and retained by release-v3, release-v4 and release-v5:",
          )
          replace(
              "docs/RELEASE.md",
              "`release-v4` repeats this protection as the final required gate, after predecessor and\nexternal validation.",
              "`release-v5` repeats this protection as the final required gate, after predecessor and\nexternal validation.",
          )
          replace(
              "docs/RELEASE.md",
              "Full `release-v3` manifests are also historical after adoption of v4, but remain full\ncertifications. The verifier selects the immutable v3 gate/input/fidelity contract from\nthe manifest's recorded policy name rather than requiring every historical manifest to\nclaim the latest policy. This compatibility does not accept self-declared or unknown\nprofiles. Release-v4-specific baseline identity likewise lives in the v4 policy contract,\nso later policy changes cannot silently alter historical v4 verification semantics.",
              "Full `release-v3` and predecessor-aware `release-v4` manifests are historical under\nrelease-v5, but remain full certifications. The verifier selects the immutable contract\nfrom the manifest's recorded policy name rather than requiring every historical manifest\nto claim the latest policy. This compatibility does not accept self-declared or unknown\nprofiles. Release-v4-specific baseline identity remains in the v4 contract, while v5 adds\nsign-language conservation without rewriting historical v4 verification semantics.",
          )
          PY
      - name: Unit GREEN including predecessor and feature-doc adversarial suites
        run: python -m pytest programs/tests -q
      - name: Current policy self-consistency
        run: PYTHONPATH=programs python -c 'import release_check; from tlhdig import release_policy; assert release_policy.POLICY == "release-v5"; assert tuple(g.name for g in release_check.GATES) == release_policy.REQUIRED_GATES'
      - name: Historical v4 remains predecessor-aware only
        run: PYTHONPATH=programs python -c 'from tlhdig import release_policy; c=release_policy.policy_contract("release-v4"); assert c and "predecessor-delta" in c.required_gates and "sign-language" not in c.required_gates'
      - name: Commit GREEN source/test/docs reconciliation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add programs/tests/test_sign_language_release_integration.py programs/tests/test_release_version.py programs/tests/test_manuscript_release_policy.py programs/tests/test_release_delta.py programs/tests/test_release_delta_adversarial.py docs/RELEASE.md
          git commit -m "Reconcile release-v5 integration contracts"
          git push origin HEAD:research/sign-lang-19
