name: Apply raw siglum provenance 18

on:
  push:
    branches: [research/joins-18]
    paths: [.github/workflows/apply-raw-siglum-18.yml]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/joins-18
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python programs/apply_raw_siglum_provenance.py
      - name: Raw siglum RED turns GREEN
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_raw_provenance.py -q
      - name: Existing parser contract stays GREEN
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscripts.py -q
      - name: Existing graph contract stays GREEN
        run: PYTHONPATH=programs python -m pytest programs/tests/test_manuscript_graph.py -q
      - name: Corpus parser conservation stays GREEN
        run: python programs/check_manuscripts_parser.py
      - run: git diff --check
      - name: Commit implementation and remove one-shot machinery
        run: |
          rm programs/apply_raw_siglum_provenance.py .github/workflows/apply-raw-siglum-18.yml
          git add programs/tlhdig/manuscripts.py programs/tlhdig/manuscript_graph.py programs/tlhdig/featuremeta.py programs/apply_raw_siglum_provenance.py .github/workflows/apply-raw-siglum-18.yml
          git diff --cached --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m 'Preserve raw manuscript siglum provenance'
          git push origin HEAD:research/joins-18
