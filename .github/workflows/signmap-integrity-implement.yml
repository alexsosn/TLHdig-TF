name: Signmap integrity implementation (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'tdd/signmap-multi-integrity-126'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Apply frozen minimal implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          cpath = Path('programs/tlhdig/cuneiform.py')
          text = cpath.read_text(encoding='utf8')
          start_marker = 'def load_multi(path) -> dict[str, str]:\n'
          end_marker = '# --------------------------------------------------------------------- numerals\n'
          assert text.count(start_marker) == 1, 'unexpected load_multi definition count'
          assert text.count(end_marker) == 1, 'unexpected numeral section count'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_block = '''def _multi_entry(parts: list[str]) -> tuple[str, str] | None:
              """Return the loader-visible reading/sequence pair, or None if unusable."""
              if (
                  len(parts) >= 2
                  and parts[0]
                  and len(parts[1]) > 1
                  and PLACEHOLDER not in parts[1]
                  and is_sign(parts[1])
              ):
                  return parts[0], parts[1]
              return None


          def validate_multi(path) -> list[str]:
              """Diagnose rows that permissive `load_multi()` would drop or overwrite."""
              if not path or not path.is_file():
                  return [f"compound sign map missing: {path}"]

              problems: list[str] = []
              seen: dict[str, int] = {}
              data_rows = 0
              usable_rows = 0
              for lineno, line in enumerate(path.read_text(encoding="utf8").splitlines(), 1):
                  if not line or line.startswith("#"):
                      continue
                  data_rows += 1
                  entry = _multi_entry(line.split("\\t"))
                  if entry is None:
                      problems.append(f"line {lineno}: unusable compound mapping row")
                      continue
                  reading, _seq = entry
                  usable_rows += 1
                  first = seen.get(reading)
                  if first is not None:
                      problems.append(
                          f"line {lineno}: duplicate reading {reading!r} (first at line {first})"
                      )
                  else:
                      seen[reading] = lineno

              if data_rows == 0:
                  problems.append("compound sign map has no data rows")
              elif usable_rows == 0:
                  problems.append("compound sign map has no usable mappings")
              return problems


          def load_multi(path) -> dict[str, str]:
              """Read `signmap-multi.tsv`: reading -> codepoint sequence.

              A spelling containing a placeholder is rejected here as well as by the learner, so
              a table generated before that rule cannot reintroduce it. `a+na` -> 𒀀▒𒀀 was
              learned at 0.986 confidence over 146 observations: high agreement means the hole in
              the tablet recurs in the same place, not that the hole is part of the word.
              """
              out: dict[str, str] = {}
              if not path or not path.is_file():
                  return out
              for line in path.read_text(encoding="utf8").splitlines():
                  if not line or line.startswith("#"):
                      continue
                  entry = _multi_entry(line.split("\\t"))
                  if entry is not None:
                      out[entry[0]] = entry[1]
              return out

          '''.replace('          ', '')
          cpath.write_text(text[:start] + new_block + text[end:], encoding='utf8')

          bpath = Path('programs/build.py')
          text = bpath.read_text(encoding='utf8')
          old_import = '    convert,\n    corpusid,\n    repair,\n'
          new_import = '    convert,\n    corpusid,\n    cuneiform,\n    repair,\n'
          assert text.count(old_import) == 1, 'build import anchor changed'
          text = text.replace(old_import, new_import, 1)
          anchor = '''    if missing_inputs:
              print("BUILD FAILED: required preflight input missing")
              for path in missing_inputs:
                  print(f"  {path}")
              return 1

              patches = repair.read_manifest(PATCHES)
          '''.replace('          ', '')
          replacement = '''    if missing_inputs:
              print("BUILD FAILED: required preflight input missing")
              for path in missing_inputs:
                  print(f"  {path}")
              return 1

              signmap_problems = cuneiform.validate_multi(signmap_multi_file)
              if signmap_problems:
                  print("BUILD FAILED: compound sign map is unusable")
                  for problem in signmap_problems[:10]:
                      print(f"  {problem}")
                  return 1

              patches = repair.read_manifest(PATCHES)
          '''.replace('          ', '')
          assert text.count(anchor) == 1, 'build preflight anchor changed'
          bpath.write_text(text.replace(anchor, replacement, 1), encoding='utf8')

          tpath = Path('programs/tests/test_clean_current_output.py')
          text = tpath.read_text(encoding='utf8')
          old_fixture = '_write(programs / "signmap-multi.tsv", "# synthetic\\n")'
          new_fixture = '_write(programs / "signmap-multi.tsv", "a\\t𒀀𒀀\\n")'
          assert text.count(old_fixture) == 1, 'synthetic map fixture changed'
          tpath.write_text(text.replace(old_fixture, new_fixture, 1), encoding='utf8')
          PY
      - name: Focused GREEN
        run: python -m pytest programs/tests/test_signmap_multi_integrity.py programs/tests/test_signmap_multi_preflight.py programs/tests/test_clean_current_output.py -q
      - name: Full unit GREEN
        run: python -m pytest programs/tests -q
      - name: Commit implementation only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add programs/build.py programs/tlhdig/cuneiform.py programs/tests/test_clean_current_output.py
          git commit -m 'fix: validate compound sign map before reset'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
