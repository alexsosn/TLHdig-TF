# Disposable guarded artifact integration for source-reviewed #159.
# Delete this workflow after successful publication to the PR branch.
name: Rebuild current TF with reviewed nested-word recovery (#161)
on:
  push:
    branches: [research/nested-word-159]
    paths: [.github/workflows/publish-nested-161.yml, programs/tests/test_nested_word_159.py]
permissions:
  contents: write
concurrency:
  group: publish-nested-161
  cancel-in-progress: true
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure reviewed #160 main ancestor and immutable original corpus
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git branch --show-current)" = "research/nested-word-159"
          git merge-base --is-ancestor origin/main HEAD
          git diff --exit-code origin/main...HEAD -- corpus/
      - run: python -m pip install -r requirements.txt
      - name: Confirm source-level TDD, policy and integrity before destructive build
        run: |
          set -euo pipefail
          python -m pytest -q programs/tests/test_nested_word_159.py programs/tests/test_source_recovery_inventory.py programs/tests/test_sign_language.py
          python programs/check_corpus_identity.py
          python programs/verify_patches.py
      - name: Verify main's last known-good current artifact population
        run: |
          PYTHONPATH=programs python - <<'PY'
          from tlhdig.paths import ROOT
          from tlhdig import compact, structure
          p = ROOT / "tf" / "0.4.0"
          counts = structure.graph_counts(p)
          assert counts["sign"] == 3386450, counts
          assert counts["word"] == 1234553, counts
          assert len(compact.read_values(p / "anchor.tf")) == 21193
          assert len(compact.read_values(p / "cu_sign.tf")) == 3024426
          print("PREBUILD CURRENT DATASET", counts, flush=True)
          PY
      - name: Rebuild the one current TF and optional provenance module
        run: python programs/build.py
      - name: Independently validate exact replacement populations and actual reading
        run: |
          PYTHONPATH=programs python - <<'PY'
          from tf.fabric import Fabric
          from tlhdig.paths import ROOT
          from tlhdig import compact, structure
          p = ROOT / "tf" / "0.4.0"
          counts = structure.graph_counts(p)
          assert counts["document"] == 23884, counts
          assert counts["sign"] == 3386368, counts
          assert counts["word"] == 1234821, counts
          anchors = len(compact.read_values(p / "anchor.tf"))
          aligned = len(compact.read_values(p / "cu_sign.tf"))
          assert anchors == 21111, anchors
          assert counts["sign"] - anchors == 3365257
          assert aligned == 3025108, aligned
          api = Fabric(locations=str(p), silent="deep").load(
              "otype oslots src_file lnr sym", silent="deep"
          )
          assert api not in (False, None)
          F, L = api.F, api.L
          docs = [d for d in F.otype.s("document")
                  if F.src_file.v(d) == "CTH 479_XML_BESRIT/KBo 41.49+.xml"]
          assert len(docs) == 1, docs
          lines = [n for n in L.d(docs[0], otype="line")
                   if F.lnr.v(n) == "{€1+2+3} Rs. III 2/2′"]
          assert len(lines) == 1, lines
          found = [F.sym.v(s) for s in L.d(lines[0], otype="sign")]
          assert found == ["pé", "e", "da", "an", "zi"], found
          print("REAL SOURCE READING AND POPULATION PASS", found, counts, flush=True)
          PY
      - name: All release-grade source and independent sign gates plus manifest
        run: |
          python programs/validate_current.py
          python programs/check_build_manifest.py
      - name: Reject any conversion-source changes and stage only generated artifacts
        run: |
          set -euo pipefail
          git diff --exit-code -- corpus/ programs/ app/ docs/ requirements.txt
          test -z "$(git ls-files --others --exclude-standard -- tf/ tf-provenance/)"
          git add -u -- tf/0.4.0 tf-provenance/0.4.0 reports/
          git diff --cached --check
          git diff --cached --quiet && { echo 'No generated artifact change'; exit 1; } || test "$?" -eq 1
          git diff --cached --name-only > /tmp/nested-generated-paths
          python - <<'PY'
          from pathlib import Path
          names=Path("/tmp/nested-generated-paths").read_text().splitlines()
          assert names and all(
              name.startswith(("tf/0.4.0/", "tf-provenance/0.4.0/", "reports/"))
              for name in names
          ), names[:30]
          assert "tf/0.4.0/BUILD-MANIFEST.json" in names
          print("CHECKED GENERATED FILES", len(names))
          PY
      - name: Commit validated dataset only to this PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data(#159): rebuild current TF and provenance with reviewed line boundaries"
          git push origin HEAD:research/nested-word-159
      - name: Upload validation reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-161-rebuild-evidence
          path: |
            reports/
            tf/0.4.0/BUILD-MANIFEST.json
          retention-days: 10
          if-no-files-found: warn
